<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// =====================================================================
// 워니의숲 독립 버전: Claude 대신 Firebase에 저장하고 접속을 표시하는 다리
// =====================================================================
// ▼ Firebase 콘솔 > 프로젝트 설정 > 내 앱(웹)에서 복사한 값을 여기에 넣어요
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDwaxCw1HEM185oou2zI2LHrAO2tsLcr7k",
  authDomain: "wonies-forest.firebaseapp.com",
  projectId: "wonies-forest",
  storageBucket: "wonies-forest.firebasestorage.app",
  messagingSenderId: "374155503580",
  appId: "1:374155503580:web:aa83b99c9ecb681ee95119"
};
// ▼ 이 닉네임으로 들어온 사람이 마을 주인 (대시보드, 숨기기, 문 닫기)
const OWNER_NICK = "이혜원숭이";

(function(){
  const configured=FIREBASE_CONFIG.apiKey&&!FIREBASE_CONFIG.apiKey.startsWith("여기")&&window.firebase;
  let fs=null, prefix=null, resolveDb, dbPromise=new Promise(r=>resolveDb=r);
  if(configured){
    try{ firebase.initializeApp(FIREBASE_CONFIG); fs=firebase.firestore(); fs.settings({ignoreUndefinedProperties:true,merge:true}); }catch(e){ console.error(e); fs=null; }
  }
  const P=p=>`villages/${prefix}/${p}`;
  const err=e=>({code:e&&e.code==="permission-denied"?"not_granted":(e&&e.code)||"error",message:e&&e.message});
  const snapDoc=d=>({id:d.id,exists:d.exists,data:()=>d.exists?d.data():undefined,metadata:{}});
  const wrapSnap=s=>({docs:s.docs.map(snapDoc),size:s.size,empty:s.empty,docChanges:()=>[],metadata:{}});
  function wrapQ(q){ return {
    where:(f,op,v)=>wrapQ(q.where(f,op,v)), orderBy:(f,d)=>wrapQ(q.orderBy(f,d||"asc")), limit:n=>wrapQ(q.limit(n)),
    get:async()=>{ try{ return wrapSnap(await q.get()); }catch(e){ throw err(e); } },
    onSnapshot:(next,onErr)=>q.onSnapshot(s=>next(wrapSnap(s)),e=>onErr&&onErr(err(e))) }; }
  function docRef(path){ const r=fs.doc(P(path)); return {
    id:r.id, path,
    get:async()=>{ try{ return snapDoc(await r.get()); }catch(e){ throw err(e); } },
    set:async d=>{ try{ await r.set(d); }catch(e){ throw err(e); } },
    update:async d=>{ try{ await r.update(d); }catch(e){ throw err(e); } },
    delete:async()=>{ try{ await r.delete(); }catch(e){ throw err(e); } },
    // 교환할 때 두 사람이 동시에 누르는 걸 막는 짧은 잠금
    acquire:async({holder,ttlMs=8000})=>{ try{ return await fs.runTransaction(async tx=>{
      const s=await tx.get(r), l=s.exists&&s.data()._lock;
      if(l&&l.exp>Date.now()&&l.holder!==holder) return {acquired:false,holder:l.holder};
      tx.set(r,{_lock:{holder,exp:Date.now()+ttlMs}},{merge:true}); return {acquired:true}; }); }catch(e){ throw err(e); } },
    onSnapshot:(next,onErr)=>r.onSnapshot(s=>next(snapDoc(s)),e=>onErr&&onErr(err(e))),
    collection:p=>col(path+"/"+p) }; }
  function col(path){ const c=fs.collection(P(path)); const q=wrapQ(c);
    q.path=path; q.doc=id=>docRef(path+"/"+(id||c.doc().id));
    q.add=async d=>{ try{ const r=await c.add(d); return docRef(path+"/"+r.id); }catch(e){ throw err(e); } };
    return q; }
  const db={ doc:docRef, collection:col };

  // 지금 함께 있는 사람: presence 문서에 위치를 남기고 1분 안에 갱신한 사람만 보여줌
  function makeRoom(){
    let me=null, lastWrite=0, pend=null, peers=[], handlers=[], unsub=null;
    const pc=()=>fs.collection(P("presence"));
    const write=()=>{ pend=null; if(!me||!me.id) return; lastWrite=Date.now(); pc().doc(me.id).set({...me,ts:Date.now()}).catch(()=>{}); };
    const fresh=()=>peers.filter(p=>Date.now()-(p.ts||0)<70000);
    let prevIds=new Set();
    const emit=()=>{ const list=fresh(), ids=new Set(list.map(p=>p.id));
      const wrap=p=>({presence:p,peer:p.id,by:null,isMe:me&&p.id===me.id,sameTab:false,kind:"viewer",guest:false,updatedAt:p.ts});
      const joined=list.filter(p=>!prevIds.has(p.id)).map(wrap), left=[...prevIds].filter(id=>!ids.has(id)).map(id=>({presence:{id}}));
      prevIds=ids; handlers.forEach(h=>{ try{ h({peers:list.map(wrap),joined,left,updated:[]}); }catch(e){} }); };
    setInterval(()=>{ if(me&&me.id) write(); emit(); },25000);
    addEventListener("pagehide",()=>{ if(me&&me.id) pc().doc(me.id).delete().catch(()=>{}); });
    return {
      async presence(patch){
        if(patch&&patch.id===null){ if(me&&me.id) pc().doc(me.id).delete().catch(()=>{}); me=null; return; }
        me={...(me||{}),...patch};
        const wait=1500-(Date.now()-lastWrite);
        if(wait<=0) write(); else if(!pend) pend=setTimeout(write,wait);
      },
      onPeers(h){ handlers.push(h);
        if(!unsub) unsub=pc().onSnapshot(s=>{ peers=s.docs.map(d=>d.data()); emit(); },()=>{});
        return ()=>{ handlers=handlers.filter(x=>x!==h); }; },
      peers(){ return fresh(); }, emit:async()=>{}, on:()=>()=>{} };
  }
  let room=null;
  const user={
    isOwner:async()=>!!(typeof S!=="undefined"&&S&&S.nick===OWNER_NICK),
    canEdit:async()=>!!(typeof S!=="undefined"&&S&&S.nick===OWNER_NICK),
    can:async()=>true,
    id:async()=>typeof docId!=="undefined"?docId:null
  };

  // 입구 비밀번호는 서버 규칙이 확인함: 맞으면 읽기가 되고, 틀리면 거절됨
  window.__gateCheck=async pw=>{
    if(!fs){ const e=document.getElementById("gateErr"); if(e) e.textContent="마을 서버 설정이 아직 안 됐어요. 마을 주인에게 알려주세요."; return false; }
    if(!pw||/[\/]/.test(pw)) return false;
    try{ prefix=pw; await fs.doc(P("config/site")).get(); resolveDb(db); return true; }
    catch(e){ prefix=null; return false; }
  };
  window.claude={ use(name){
    if(name==="db") return fs?dbPromise:Promise.resolve(null);
    if(name==="room") return dbPromise.then(d=>d?(room=room||makeRoom()):null);
    if(name==="user") return Promise.resolve(user);
    return Promise.resolve(null);
  }};
  document.addEventListener("DOMContentLoaded",()=>{ const n=document.getElementById("connNote"); if(n) n.textContent=fs?"마을에 연결하는 중이에요…":"마을 서버 설정이 아직 안 됐어요."; });
})();
</script>

<title>🏕워니의숲</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 휴대폰 한 손 게임. 위 상태바, 가운데 화면(마을·시장·쉬기·꾸미기·이웃·교환·채팅), 아래 탭바 */
:root{
  --sky:#d4ebf5; --grass:#a9d574; --grass-d:#6fa845; --soil:#9a6a45; --soil-d:#6f4a2e;
  --paper:#fffaf0; --card:#ffffff; --ink:#3b2f24; --muted:#8a7a68; --line:#eadfcb;
  --berry:#e2566f; --honey:#f2b632; --water:#7cc3e6; --leaf:#4f8a2e;
  --display:"Jua","BM JUA","Apple SD Gothic Neo",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-size:15px;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.screen{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(var(--sky) 0 55%,var(--grass) 55% 100%)}
.panel{background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:20px;width:100%;max-width:400px;
  display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 rgba(59,47,36,.08)}
.logo{font-family:var(--display);font-size:40px;margin:0;color:var(--soil-d);text-align:center;line-height:1.1}
.logo small{display:block;font-size:15px;color:var(--muted);font-family:var(--body);margin-top:6px}
.lbl{font-size:13px;color:var(--muted)}
.btn{background:var(--berry);color:#fff;border:0;border-radius:14px;padding:12px 16px;font-family:var(--display);font-size:17px;
  box-shadow:0 4px 0 #b13e54}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b13e54}
.btn.sub{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.sm{font-size:14px;padding:7px 12px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.err{color:var(--berry);font-size:13px;min-height:1em;margin:0}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:0}

/* 게임 */
#game{height:var(--appH,100%);display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--paper)}
.top{display:flex;align-items:center;gap:8px;padding-block:8px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  background:var(--paper);border-bottom:2px solid var(--line)}
.top .me{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.top .me b{font-family:var(--display);font-weight:400;font-size:16px;line-height:1.15;overflow-wrap:anywhere}
.coin{font-family:var(--display);background:#fff3cf;border:2px solid var(--honey);border-radius:999px;padding:3px 10px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.iconbtn{background:#fff;border:2px solid var(--line);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;font-size:16px;padding:0;flex:none}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:12px 16px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}
nav.tabs{display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border-top:2px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{background:none;border:0;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);position:relative}
nav.tabs button .i{font-size:20px;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current="page"]::after{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--berry)}
.dot{position:absolute;top:4px;right:20%;width:8px;height:8px;border-radius:50%;background:var(--berry)}
h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.seg{display:flex;background:#f3ead8;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:14px}
.seg button[aria-pressed="true"]{background:#fff;font-weight:700;box-shadow:0 1px 0 var(--line)}

/* 마을 장면 */
.yard{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(#cfe9f4 0 34%,var(--grass) 34%);
  border:2px solid var(--line);padding:10px;display:grid;grid-template-columns:1.2fr 1fr;gap:6px;align-items:end;min-height:190px}
.yard .sign{position:absolute;top:8px;left:10px;font-family:var(--display);background:#fff;border:2px solid var(--soil);
  border-radius:10px;padding:2px 10px;font-size:14px;color:var(--soil-d)}
.house{cursor:pointer;background:none;border:0;padding:0}
.house svg{width:100%;max-width:200px;display:block}
.charbox svg{width:100%;max-width:120px;display:block;margin:0 auto}
.pen{background:#c9e59c;border:3px dashed #8bbf5c;border-radius:18px;padding:8px;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;min-height:64px}
.animal{position:relative;background:none;border:0;font-size:28px;padding:4px 0;animation:bob 2.4s ease-in-out infinite}
.animal:nth-child(2n){animation-delay:-1.1s}
.animal .ready{position:absolute;top:-6px;right:-2px;font-size:15px;background:#fff;border-radius:999px;padding:1px 3px;border:2px solid var(--honey)}
.animal .say{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:12px;background:#fff;border:2px solid var(--line);
  border-radius:10px;padding:2px 7px;white-space:nowrap;font-family:var(--display)}
.pen .empty{grid-column:1/-1;font-size:13px;color:#5d7f3e;text-align:center;align-self:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.field{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plot{aspect-ratio:1;max-width:100%;border:0;border-radius:16px;background:var(--soil);box-shadow:inset 0 -6px 0 var(--soil-d);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;position:relative;padding:4px}
.plot.locked{background:#cdbfa6;box-shadow:inset 0 -6px 0 #b3a387;color:#6b5d48}
.plot .ic{font-size:30px;line-height:1}
.plot .t{font-size:11px;font-variant-numeric:tabular-nums}
.plot .bar{width:70%;height:5px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.plot .bar i{display:block;height:100%;background:#c8f08a}
.plot.ready{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 -6px 0 var(--soil-d),0 0 0 4px #ffe58a}}
.inv{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 9px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* 목록 */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.item .ic{font-size:26px;width:34px;text-align:center;flex:none}
.item .nm{font-weight:700}
.item .sub{font-size:12px;color:var(--muted)}
.price{font-family:var(--display);white-space:nowrap}

/* 시트 */
.sheetwrap{position:fixed;inset:0;background:rgba(40,30,20,.35);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:86%;overflow-y:auto;border-radius:22px 22px 0 0;
  padding-block:16px max(18px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.toast{position:fixed;left:50%;top:calc(120px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:9px 16px;border-radius:999px;font-size:14px;z-index:40;max-width:90%;text-align:center;transition:opacity .3s}

/* 꾸미기 */
.closet{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.acc{background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.acc svg{width:64px;height:64px}
.acc[aria-pressed="true"]{border-color:var(--berry);background:#fff0f2}
.acc .p{font-family:var(--display);font-size:13px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--berry)}
.bases{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bases button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px;font-size:12px}
.bases button svg{width:100%;height:auto;max-height:70px}
.bases button[aria-pressed="true"]{border-color:var(--berry);background:#fff0f2}

/* 쉬기 */
.rest svg.scene{width:100%;height:auto;display:block;border-radius:20px;border:2px solid var(--line)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px}
.acts button .i{font-size:22px}
.acts button[aria-pressed="true"]{border-color:#5aa6d6;background:#eaf6fd}
.ripple{animation:rip 3s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes rip{from{transform:scale(.6);opacity:.9}to{transform:scale(1.6);opacity:0}}
.flow{animation:flow 6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-60}}
.zz{animation:zz 3s ease-in-out infinite;font-family:var(--display)}
@keyframes zz{50%{opacity:.3;transform:translateY(-4px)}}

/* 채팅 */
.chat{display:flex;flex-direction:column;gap:6px}
.msg{max-width:82%;align-self:flex-start;background:#fff;border:2px solid var(--line);border-radius:14px 14px 14px 4px;padding:6px 10px;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:#fff0c9;border-color:#f2d27a;border-radius:14px 14px 4px 14px}
.msg .who{font-size:11px;color:var(--muted);display:block}
.composer{display:flex;gap:8px}
/* 글 쓰는 동안: 화면은 그대로, 입력창만 키보드 바로 위로 */
.composer.typing{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:50;background:var(--paper);border-top:2px solid var(--line);

.tripsky{position:absolute;inset:0 0 52% 0;background:linear-gradient(#bfe3f3,#e8f6fb)}

.zoombtns{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;line-height:1}

.actbar{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px;min-height:56px;font-size:14px}

.on{color:#2fae4f;font-weight:700}
.news ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;line-height:1.5}

// 첫 화면에서 멈추면 원인을 화면에 보여주고, 그냥 들어가기 버튼을 띄워요

let ac=null, master=null, musicGain=null, sfxGain=null;
function audio(){
  try{
    if(!ac){ ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain(); master.gain.value=.9; master.connect(ac.destination);
      musicGain=ac.createGain(); musicGain.gain.value=.6; musicGain.connect(master);
      sfxGain=ac.createGain(); sfxGain.gain.value=1; sfxGain.connect(master); }
    if(ac.state==="suspended") ac.resume();
  }catch(e){}
  return ac;
}
function tone(f,dur,{type="sine",vol=.12,at=0,to=null,dest=null,attack=.01}={}){
  if(!audio()) return; const t=ac.currentTime+at, o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur*.8);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(dest||sfxGain); o.start(t); o.stop(t+dur+.05);
}
const SFX={

  harvest(){ tone(523,.15,{vol:.12,type:"triangle"}); tone(784,.25,{at:.1,vol:.12,type:"triangle"}); },
  coin(){ tone(1318,.12,{type:"square",vol:.05}); tone(1760,.35,{at:.08,type:"square",vol:.05}); tone(2637,.25,{at:.08,vol:.03}); },
  build(){ [0,.18,.36].forEach(t=>tone(180,.12,{at:t,type:"square",vol:.06,to:120})); [523,659,784,1046].forEach((f,i)=>tone(f,.4,{at:.6+i*.1,vol:.08,type:"triangle"})); },
  tap(){ tone(660,.08,{vol:.06,type:"triangle"}); },

function voice(kind){
  if(!audio()) return; const t=ac.currentTime;
  const saw=(f0,path,dur,filt,vol)=>{
    const o=ac.createOscillator(), bp=ac.createBiquadFilter(), g=ac.createGain();
    o.type="sawtooth"; o.frequency.setValueAtTime(f0,t); path.forEach(([f,tt])=>o.frequency.linearRampToValueAtTime(f,t+tt));
    bp.type="bandpass"; bp.frequency.value=filt; bp.Q.value=2.5;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.05); g.gain.setValueAtTime(vol,t+dur*.6); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(bp); bp.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+dur+.05); return o; };
  if(kind==="cat") saw(520,[[820,.16],[700,.35],[460,.6]],.65,1300,.22);
  if(kind==="dog"){ saw(260,[[170,.12]],.16,900,.25); setTimeout(()=>voice("dog2"),220); }
  if(kind==="dog2") saw(270,[[160,.12]],.16,900,.22);
  if(kind==="chicken") [0,.12,.24,.42].forEach((d,i)=>tone(i===3?820:620,i===3?.25:.07,{at:d,type:"square",vol:.05,to:i===3?560:480}));
  if(kind==="cow") saw(150,[[120,.4],[105,1.1]],1.2,600,.3);
  if(kind==="sheep"){ const o=saw(330,[[300,.6]],.7,1100,.22); const l=ac.createOscillator(), lg=ac.createGain(); l.frequency.value=11; lg.gain.value=25; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t+.7); }
}

let music=false, musicTimer=null, beat=0, mNext=0, mIdx=2;
const MEL=[523.25,587.33,659.25,783.99,880,1046.5], BASS=[130.81,110,87.31,98];
function musicTick(){
  if(!ac) return;
  while(mNext<ac.currentTime+.4){
    const at=mNext-ac.currentTime;
    if(beat%8===0){ const b=BASS[(beat/8)%4]; tone(b,3.2,{type:"triangle",vol:.05,at,dest:musicGain,attack:.2}); tone(b*1.5,3,{vol:.025,at,dest:musicGain,attack:.3}); }
    if(Math.random()<.62){ mIdx=Math.max(0,Math.min(MEL.length-1,mIdx+[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)]));
      const f=MEL[mIdx]; tone(f,1.1,{vol:.045,at,dest:musicGain,attack:.005}); tone(f*2,.5,{vol:.008,at,dest:musicGain,attack:.005}); }
    beat++; mNext+=.46;
  }
}

function waterOn(){
  if(water||!audio()) return;
  const len=ac.sampleRate*2, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
  let last=0; for(let i=0;i<len;i++){ last=(last+.02*(Math.random()*2-1))/1.02; d[i]=last*3.5; }
  const src=ac.createBufferSource(); src.buffer=buf; src.loop=true;
  const lp=ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=900;
  const g=ac.createGain(); g.gain.value=0; g.gain.linearRampToValueAtTime(.18,ac.currentTime+2);
  src.connect(lp); lp.connect(g); g.connect(master); src.start(); water={src,g};
}
function waterOff(){ if(!water) return; const w=water; water=null; w.g.gain.linearRampToValueAtTime(0,ac.currentTime+1); w.src.stop(ac.currentTime+1.1); }

async function hashPin(nick,pin){
  const txt="dotori:"+nick.trim().toLowerCase()+":"+pin;
  try{ const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt)); return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=5381; for(const ch of txt) h=((h<<5)+h+ch.charCodeAt(0))|0; return "x"+(h>>>0).toString(16); }
}

async function flush(){

  ls.set("dv:p:"+docId,data);

}

function migrate(){
  S.inv=S.inv||{}; S.owned=S.owned||[...STARTER]; S.animals=S.animals||[]; S.house=S.house||{mat:null,level:0};
  S.room=S.room||[]; S.furnStore=S.furnStore||{};

    (S.plots||[]).forEach((p,i)=>{ if(p.crop&&spots[i]) S.field[spots[i].join(",")]={crop:p.crop,at:p.at,dur:p.dur}; });
    S.fieldMax=Math.max(6,(S.plots||[]).filter(p=>p.open).length); delete S.plots; save(); }
  S.fieldMax=S.fieldMax||6;
  if(!S.mapV2){ S.field=convertField(S.field); S.mapV2=true; save(); }

  if(!Array.isArray(S.houses)||!S.houses.length) S.houses=[{...(S.house||{mat:null,level:0}),lot:0}];

}

let visitDoc=null, visitAll=[], visitCur=null, visitTimer=null, hbTimer=null;
const kstDate=ms=>new Date(ms+9*3600e3).toISOString().slice(0,10);
async function visitStart(){
  if(mode!=="db"||!S) return;
  try{
    const u=await window.claude.use("user"); const uid=u?await u.id():null; if(!uid) return;
    visitDoc=db.doc("visits/"+uid);
    const snap=await withTimeout(visitDoc.get(),10000);
    visitAll=(snap.exists&&Array.isArray(snap.data().sessions))?JSON.parse(JSON.stringify(snap.data().sessions)):[];
    const now=Date.now();
    visitCur={sid:now.toString(36),pid:docId,nick:S.nick,date:kstDate(now),enter:now,last:now,leave:null,acts:[]};
    visitAll.push(visitCur); if(visitAll.length>150) visitAll=visitAll.slice(-150);
    visitPut();
  }catch(e){ visitDoc=null; }
  clearInterval(hbTimer); hbTimer=setInterval(()=>visitSave({}),60000);
}
function visitPut(){ if(!visitDoc) return; visitDoc.set({sessions:visitAll,nick:S?S.nick:"",updatedAt:Date.now()}).catch(()=>{}); }
function logAct(a){ if(!visitCur) return; visitCur.acts.push({t:Date.now(),a}); if(visitCur.acts.length>300) visitCur.acts.shift(); clearTimeout(visitTimer); visitTimer=setTimeout(()=>visitSave({}),3000); }
function visitSave(extra){ if(!visitCur) return; Object.assign(visitCur,{last:Date.now()},extra); visitPut(); }
function visitEnd(){ if(!visitCur) return; clearInterval(hbTimer); visitSave({leave:Date.now()}); }
document.addEventListener("visibilitychange",()=>{ if(!visitCur) return; if(document.hidden) visitSave({leave:Date.now()}); else visitSave({leave:null}); });
addEventListener("pagehide",visitEnd);
// 받침에 따라 은/는
function josa(word,a,b){ const ch=(word||"").slice(-1).charCodeAt(0); if(ch<0xAC00||ch>0xD7A3) return /[0-9lmnrLMNR]$/.test(word)?a:b; return (ch-0xAC00)%28?a:b; }

async function joinPresence(){
  try{ roomCap=roomCap||(window.claude&&window.claude.use?await window.claude.use("room"):null); }catch(e){ roomCap=null; }
  if(!roomCap||!S) return;
  try{ await roomCap.presence({id:docId,nick:S.nick,char:S.char,scene:null}); lastPresKey=""; }catch(e){}
  if(!joinPresence.bound){ joinPresence.bound=true; presenceSince=Date.now();
    roomCap.onPeers(ch=>{ updatePeers(ch.peers); const ids=new Set(); ch.peers.forEach(p=>{ if(p.presence&&p.presence.id) ids.add(String(p.presence.id)); });
      const before=onlineIds; onlineIds=ids;
      ch.joined.forEach(p=>{ const pr=p.presence||{}; if(pr.nick&&pr.id!==docId&&!before.has(pr.id)&&shown(pr.id)&&Date.now()-presenceSince>4000) joinBanner(pr.nick); });
      if(tab==="neighbors") render(); else if(tab==="village"&&(ch.joined.length||ch.left.length)){ const chip=$("onChip"); if(chip) chip.innerHTML=`<span class="on">●</span> 접속 ${onlineCount()}명`; } }); }
}
function subscribe(){
  unsubs.forEach(u=>{try{u()}catch(e){}}); unsubs=[];
  const on=(q,fn)=>{ try{ unsubs.push(q.onSnapshot(fn,()=>{})); }catch(e){} };
  on(db.collection("players").orderBy("updatedAt","desc").limit(60),s=>{ players=s.docs.map(d=>({id:d.id,...d.data()})); if(["neighbors","rest"].includes(tab)) render(); else if(tab==="village"&&where==="map"&&!visitId){ /* 지도는 매 프레임 다시 그림 */ } });
  on(db.collection("offers").orderBy("createdAt","desc").limit(60),s=>{ offers=s.docs.map(d=>({id:d.id,...d.data()})); settleOffers(); if(tab==="trade") render(); });
  on(db.collection("chat").orderBy("at","desc").limit(60),s=>{
    const prev=chats.length?chats[chats.length-1].at:Date.now()-20000; chats=s.docs.map(d=>({id:d.id,...d.data()})).reverse();
    chats.forEach(m=>{ if(m.at>prev&&m.from&&m.from!=="system"&&shown(m.from)&&Date.now()-m.at<20000) sayBubble(m.from,m.text); });
    const newest=chats.length?chats[chats.length-1]:null;
    if(newest&&prev&&newest.at>prev&&newest.from!==docId) SFX.chat();
    if(tab==="chat"){ chatSeen=newest?newest.at:0; renderChatList(); } else renderTabs(); });
  on(db.collection("guestbook").where("to","==",docId).limit(100),s=>{
    const before=myNotes.length?myNotes[0].at:0;
    myNotes=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at); renderTabs(); updateInboxBadge();
    const nw=myNotes[0]; if(inboxShown&&nw&&before&&nw.at>before&&nw.kind==="argue") toast(`😤 ${nw.fromNick}님이 따지러 왔어요: ${nw.text}`); });
  on(db.collection("thefts").orderBy("at","desc").limit(200),s=>{ thefts=s.docs.map(d=>({id:d.id,...d.data()})); processThefts(); animsKey=""; });
  on(db.collection("jails").orderBy("at","desc").limit(100),s=>{ jails=s.docs.map(d=>({id:d.id,...d.data()})); onJails(); });
  on(db.collection("dms").where("to","==",docId).limit(300),s=>{ dmIn=s.docs.map(d=>({id:d.id,...d.data()})); onDmSnapshot(); });
  on(db.collection("dms").where("from","==",docId).limit(300),s=>{ dmOut=s.docs.map(d=>({id:d.id,...d.data()})); onDmSnapshot(); });
  let gIn=[], gOut=[]; const mergeG=()=>{ gifts=[...gIn,...gOut]; processGifts(); };
  on(db.collection("gifts").where("to","==",docId).limit(100),s=>{ gIn=s.docs.map(d=>({id:d.id,...d.data()})); mergeG(); });
  on(db.collection("gifts").where("from","==",docId).limit(100),s=>{ gOut=s.docs.map(d=>({id:d.id,...d.data()})); mergeG(); });
}

let toastT=null;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; t.style.opacity=1; clearTimeout(toastT); toastT=setTimeout(()=>{t.style.opacity=0; setTimeout(()=>t.hidden=true,300)},2200); }
function openSheet(title,html,bind){
  const w=$("sheetwrap"); w.innerHTML=`<div class="sheet" role="dialog" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="iconbtn" data-close aria-label="닫기">✕</button></header>${html}</div>`;
  const openedAt=Date.now();
  w.hidden=false; w.onclick=e=>{ if(e.target.closest("[data-close]")||(e.target===w&&Date.now()-openedAt>450)) closeSheet(); };
  if(bind) bind(w);
}
function closeSheet(){ $("sheetwrap").hidden=true; $("sheetwrap").innerHTML=""; }
const inv=k=>S.inv[k]||0;
// 동물(a_소 등)은 받으면 우리로, 줄 때는 창고 먼저·그다음 우리에서
function addInv(k,n){ if(k==="coin"){ S.coins+=n; return; }
  const A=ITEMS[k]&&ITEMS[k].animal;
  if(A){ if(n>0){ for(let i=0;i<n;i++){ if(S.animals.length<MAX_ANIMALS) S.animals.push({type:A,at:Date.now()}); else S.inv[k]=inv(k)+1; } }
    else { let need=-n; const fi=Math.min(inv(k),need); S.inv[k]=inv(k)-fi; need-=fi; while(need>0){ const i=S.animals.findIndex(a=>a.type===A); if(i<0) break; S.animals.splice(i,1); need--; } }

  cv.style.width=w+"px"; cv.style.height=h+"px"; cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);

  let drag=null, pinch=null; const pts=new Map();

// ---------- 마을 지도 ----------
function tapMap(fx,fy){
  const x=Math.floor(fx), y=Math.floor(fy), o=owner(), visiting=!!visitId;
  if(jailTap(fx,fy)) return;
  if(jailBlock()) return;
  if(toaTap(fx,fy)) return;
  if(pipiTap(fx,fy)) return;
  // 그림 친구에게 인사
  if(kidTap(fx,fy)) return;
  // 길강아지·길고양이
  if(stray&&!visiting&&Math.hypot(stray.x-fx,stray.y-fy)<.95){ walkTo(W.map,[[stray.x+(stray.x<W.map.x?.9:-.9),stray.y+.1]]); strayTap(); return; }
  // 동물
  for(let i=0;i<anims.length;i++){ const a=anims[i]; if(Math.hypot(a.x-fx,a.y-fy)<.6){
    walkTo(W.map,[[Math.min(Math.max(fx,0.5),PEN.x-.4),fy]]); if(!visiting) animalTap(i); else { voice(a.type); lureSheet(a.type); } a.say=1.6; return; } }
  const kind=tileKind(x,y);
  if(housePlace&&!visiting){ housePlace.x=Math.floor(fx)-1; housePlace.y=Math.floor(fy)-1; SFX.tap(); renderAct(); return; }
  // 누른 칸에 작물이 있으면 작물이 먼저 (집 창이 뜨지 않게)
  const hasCrop=!!fieldOf(o)[x+","+y];
  if(!hasCrop){
    const hi=houseAt(o,x,y);
    if(hi>=0){ const d=houseDoor(housesOf(o)[hi],hi); sel=null; walkTo(W.map,[[d.x+.5,d.y+.5]],()=>enterRoom(hi)); renderAct(); return; }
    // 집 창은 '빈 집터' 표시 안을 눌렀을 때만
    if((kind==="house"||kind==="door")&&!visiting&&!housesOf(S)[0].mat){ sel=null; houseSheet(); return; }
  }
  if(kind==="gate"){ sel=null; walkTo(W.map,[[PATH_X+.5,MR-.5]],goSheet); renderAct(); return; }
  if(kind==="out") return;
  sel={x,y}; SFX.tap();
  const k=x+","+y, f=fieldOf(o)[k];
  walkTo(W.map,[[x+.5,y+.62]],()=>{ if(!visiting&&f&&plotState(f).stage==="ready") harvestSmart(x,y); renderAct(); });
  renderAct();
}
function plantAt(x,y,ck){
  const c=CROPS[ck]; if(S.coins<c.cost){ toast(`동전이 ${c.cost-S.coins}개 모자라요`); SFX.no(); return; }
  if(!useEnergy("plant",true)) return;
  S.coins-=c.cost; S.field=S.field||{}; S.field[x+","+y]={crop:ck,at:Date.now(),dur:c.time};
  SFX.plant(); puff(x+.5,y+.5,"#8a5a3b"); logAct(`${c.name} 심기`); save(); sel=null; renderTop(); renderAct(); toast(`${c.name}을(를) 심었어요`);
}
function harvestAt(x,y){
  const k=x+","+y, f=S.field[k]; if(!f||plotState(f).stage!=="ready") return;
  const c=CROPS[f.crop], yld=c.yield*(buffOn()?2:1); useEnergy("harvest"); addInv(f.crop,yld); if(f.crop==="rice") addInv("hay",2);
  if(c.regrow){ f.at=Date.now(); f.dur=c.regrow; } else delete S.field[k];
  sel=null; SFX.harvest(); puff(x+.5,y+.4,"#ffd84d"); logAct(`${c.item||c.name} 수확`); save(); toast(`${c.item||c.name} ${yld}개 수확!${buffOn()?" 🍰 두 배!":""}${f.crop==="rice"?" 지푸라기 2개도 생겼어요":""}`);
  render();
}
// 다 익은 게 10개 이상이면 한 번에 10개씩 수확 (12개면 10개 → 1개 → 1개). 누른 것부터, 가까운 순서로
function readyAll(x,y){
  return Object.entries(S.field||{}).filter(([k,p])=>plotState(p).stage==="ready").map(([k])=>k.split(",").map(Number))
    .sort((a,b)=>(a[0]===x&&a[1]===y?-1:0)-(b[0]===x&&b[1]===y?-1:0)||Math.hypot(a[0]-x,a[1]-y)-Math.hypot(b[0]-x,b[1]-y)); }
function harvestSmart(x,y){ if(readyAll(x,y).length>=10) harvestMany(x,y); else harvestAt(x,y); }
function harvestMany(x,y){
  const list=readyAll(x,y).slice(0,10); if(!list.length) return; const got={}; let hay=0;
  list.forEach(([px,py])=>{ const k=px+","+py, f=S.field[k], c=CROPS[f.crop], yld=c.yield*(buffOn()?2:1); useEnergy("harvest"); addInv(f.crop,yld); got[f.crop]=(got[f.crop]||0)+yld;
    if(f.crop==="rice"){ addInv("hay",2); hay+=2; } if(c.regrow){ f.at=Date.now(); f.dur=c.regrow; } else delete S.field[k]; puff(px+.5,py+.4,"#ffd84d"); });
  const txt=Object.entries(got).map(([k,n])=>`${CROPS[k].item||CROPS[k].name} ${n}개`).join(", ");
  sel=null; SFX.harvest(); logAct(`${list.length}칸 한 번에 수확 (${txt})`); save();
  toast(`🧺 ${list.length}칸 한 번에 수확! ${txt}${buffOn()?" 🍰 두 배!":""}${hay?` · 지푸라기 ${hay}개`:""}`); render();
}
function animalTap(i){
  const a=S.animals[i]; if(!a) return; const A=ANIMALS[a.type];
  voice(a.type);
  if(animalReady(a)){ useEnergy("animal");
    if(A.product==="coin"){ const n=5+Math.floor(Math.random()*11); S.coins+=n; SFX.coin(); toast(`${A.name}가 동전 ${n}개를 물어왔어요`); }
    else { addInv(A.product,1); SFX.harvest(); toast(`${ITEMS[A.product].name} 1개를 얻었어요`); }

  }
}
function animalReady(a){ return (Date.now()-a.at)/1000>=ANIMALS[a.type].every; }
function plotState(p){ const el=(Date.now()-p.at)/1000, pr=Math.min(1,el/p.dur); return {stage:pr>=1?"ready":"grow",pr,left:p.dur-el}; }
function puff(x,y,color){ for(let i=0;i<10;i++) sparkles.push({x,y,vx:(Math.random()-.5)*2,vy:-Math.random()*2,life:1,color}); }
function syncAnims(o){

function enterRoom(i=0){ if(jailBlock()) return; if(S.ride){ if(S.ride==="car"&&visitId) parkedCar={pid:visitId,x:W.map.x,y:W.map.y}; S.ride=null; save(); } curHouse=i; floor=0; RC=8+3*Math.min(2,((housesOf(owner())[i])||{}).wing||0); where="room"; placing=null; resting=null; W.room.x=ROOM_DOOR.x+.5; W.room.y=ROOM_DOOR.y+.3; W.room.path=[]; fixBlockedFurniture(); SFX.tap(); render(); }

function drawMap(c,t,time,dt){
  const o=owner(); syncAnims(o);
  const x0=Math.max(0,Math.floor(cam.x)-1), x1=Math.min(MC,Math.ceil(cam.x+viewW())+1), y0=Math.max(0,Math.floor(cam.y)-1), y1=Math.min(MR,Math.ceil(cam.y+viewH())+1);
  // 바닥
  for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){
    const k=tileKind(x,y), h=hash2(x,y), px=x*t, py=y*t;
    const g=h<.5?"#a7d36f":"#a2cf6a"; c.fillStyle=k==="pen"?((x+y)%2?"#c4e39a":"#bddc92"):g; c.fillRect(px,py,t+.6,t+.6);
    if(k==="water"||k==="bridge"){
      c.fillStyle="#7cc3e6"; c.fillRect(px,py,t+.6,t+.6);
      c.strokeStyle="rgba(255,255,255,.55)"; c.lineWidth=1.5; const off=((time*10+h*40)%t);
      c.beginPath(); c.moveTo(px+off*.5,py+t*(.3+h*.4)); c.lineTo(px+off*.5+t*.28,py+t*(.3+h*.4)); c.stroke();
      // 물가 테두리

  if(right){ s.mode="eat"; s.t=0; s.food=act==="bone"?"🦴":act==="cheese"?"🧀":"🍡"; if(act==="cheese"){ addInv("cheese",-1); save(); }
    [0,.25,.5,.75,1].forEach(d=>tone(260+Math.random()*80,.07,{at:d,type:"square",vol:.03}));
    toast(act==="cheese"?`${name}가 치즈를 냠냠 맛있게 먹어요`:act==="bone"?"강아지가 뼈다귀를 맛있게 먹어요":"고양이가 츄르를 맛있게 먹어요"); logAct(`${name}에게 ${act==="bone"?"뼈다귀":"츄르"} 주기`); return; }

  const dx=s.x-W.map.x, dy=s.y-W.map.y, d=Math.hypot(dx,dy)||1;
  s.mode="flee"; s.t=0; s.fx=s.x+dx/d*9; s.fy=s.y+dy/d*9; s.dir=dx<0?1:-1;
  tone(900,.25,{to:300,type:"sawtooth",vol:.04}); voice(s.type);
  toast(s.type==="dog"?"강아지는 츄르가 싫었나 봐요. 후다닥 도망갔어요":"고양이는 뼈다귀가 싫었나 봐요. 후다닥 도망갔어요");
  logAct(`${name}가 도망감`);
}
function adoptDone(){
  const s=stray; if(!s) return; stray=null;
  S.animals.push({type:s.type,at:Date.now(),stray:true}); animsKey=""; save();
  SFX.build(); voice(s.type); logAct(`${s.type==="dog"?"강아지":"고양이"}를 데려와 키우기`);
  toast(`새 가족이 생겼어요! ${s.type==="dog"?"강아지":"고양이"}가 동물 우리에서 지내요`); render();
}

// =====================================================================
// 마을을 산책하는 그림 친구 둘 (빨강이, 노랑이) — 직접 그린 그림
// =====================================================================
const KIDS=[
  {key:"red", legY:.69, splitX:.46, x:PATH_X+3.5, y:PATH_Y+.6},
  {key:"yellow", legY:.71, splitX:.34, x:PATH_X-3.5, y:PATH_Y+.6}
].map(k=>{ const im=new Image(); im.src=KID_IMG[k.key]; return {...k,im,tx:null,ty:null,wait:1+Math.random()*3,dir:1,ph:Math.random()*6,wave:0,walking:false}; });
function kidTarget(k){
  for(let i=0;i<20;i++){ const x=Math.max(1,Math.min(MC-2,k.x+(Math.random()-.5)*12)), y=Math.max(2,Math.min(MR-2,k.y+(Math.random()-.5)*10)), kind=tileKind(Math.floor(x),Math.floor(y));
    if(kind==="path"||kind==="grass"||kind==="bridge"){ k.tx=x; k.ty=y; return; } }
}
function stepKids(dt){
  KIDS.forEach(k=>{
    if(k.wave>0){ k.wave-=dt; k.walking=false; return; }
    if(k.tx==null){ k.wait-=dt; k.walking=false; if(k.wait<=0) kidTarget(k); return; }
    const dx=k.tx-k.x, dy=k.ty-k.y, d=Math.hypot(dx,dy);
    if(d<.05){ k.tx=null; k.wait=2+Math.random()*5; k.walking=false; return; }
    const sp=Math.min(d,dt*.9); k.x+=dx/d*sp; k.y+=dy/d*sp; k.walking=true; k.ph+=dt*7; if(Math.abs(dx)>.02) k.dir=dx<0?-1:1;
  });
}
function drawKids(items,c,t,time){
  KIDS.forEach(k=>{ items.push({y:k.y,d:()=>{
    const im=k.im; if(!im.complete||!im.naturalWidth) return;
    const W0=im.naturalWidth, H0=im.naturalHeight, h=t*1.6, w=h*W0/H0;
    const legTop=H0*k.legY, sx=W0*k.splitX;
    const swing=k.walking?Math.sin(k.ph)*.38:0, bob=k.walking?Math.abs(Math.sin(k.ph))*t*.05:0;
    const rock=k.wave>0?Math.sin(time*12)*.12:0;
    c.fillStyle="rgba(0,0,0,.15)"; c.beginPath(); c.ellipse(k.x*t,k.y*t+t*.04,w*.3,t*.08,0,0,Math.PI*2); c.fill();
    c.save(); c.translate(k.x*t,k.y*t-bob); c.scale(k.dir,1); c.rotate(rock);
    const ox=-w/2, oy=-h, s=w/W0;
    // 다리: 왼쪽·오른쪽을 엉덩이에서 번갈아 흔듦
    [[0,sx,swing],[sx,W0-sx,-swing]].forEach(([x0,ww,a])=>{ c.save(); const px=ox+(x0+ww/2)*s, py=oy+legTop*s; c.translate(px,py); c.rotate(a);
      c.drawImage(im,x0,legTop,ww,H0-legTop,-ww/2*s,0,ww*s,(H0-legTop)*s); c.restore(); });
    // 몸통
    c.drawImage(im,0,0,W0,legTop,ox,oy,w,legTop*s);
    c.restore();
    if(k.wave>0){ emo(c,"👋",k.x*t+k.dir*w*.5,k.y*t-h*.75+Math.sin(time*12)*t*.05,t*.45);
      label(c,"안녕!",k.x*t,k.y*t-h-4,Math.max(12,t*.34),"#c2410c"); }
  }}); });
}
function kidTap(fx,fy){
  const k=KIDS.find(k=>Math.abs(k.x-fx)<.7&&fy>k.y-1.4&&fy<k.y+.2); if(!k) return false;
  k.wave=2.6; k.dir=W.map.x<k.x?-1:1;
  [784,988,1175].forEach((f,i)=>tone(f,.18,{at:i*.09,vol:.06,type:"triangle"}));
  return true;
}

const TOA_SLOT_MS=3*60000, TOA_LINE="나는 또아에요. 나는 딸기를 좋아해요 🍓";
let toa=null, toaSlotSeen=null;
const toaSlot=()=>Math.floor(Date.now()/TOA_SLOT_MS);
function toaVillage(){ if(mode!=="db") return docId; const vs=villages(); if(!vs.length) return docId; return vs[toaSlot()%vs.length].p.pid; }
function toaHere(){ return where==="map"&&toaVillage()===(visitId||docId)&&!(S.toaGiven===toaSlot()+":"+(visitId||docId)&&!toa); }
function stepToa(dt,time){
  const here=where==="map"&&toaVillage()===(visitId||docId), slot=toaSlot()+":"+(visitId||docId);
  if(!here){ toa=null; return; }
  if(!toa){ if(S.toaGiven===slot) return;
    toa={x:PATH_X+.5,y:MR-1.2,tx:PATH_X+.5,ty:PATH_Y+.5,wait:0,dir:1,ph:0,talkAt:time+1.5,leaving:false,slot,walking:false};
    if(toaSlotSeen!==slot){ toaSlotSeen=slot; toast(`🍓 또아가 ${visitId?"이 마을":"우리 마을"}에 놀러 왔어요!`); } }
  const k=toa;
  if(time>k.talkAt&&!k.leaving){ sayBubble("toa",TOA_LINE); k.talkAt=time+9+Math.random()*5; }
  if(k.tx==null){ k.wait-=dt; k.walking=false;
    if(k.wait<=0){ for(let i=0;i<20;i++){ const x=Math.max(1.5,Math.min(MC-2,k.x+(Math.random()-.5)*10)), y=Math.max(3,Math.min(MR-2,k.y+(Math.random()-.5)*8)), kd=tileKind(Math.floor(x),Math.floor(y));
      if(kd==="path"||kd==="grass"||kd==="bridge"){ k.tx=x; k.ty=y; break; } } k.wait=2+Math.random()*4; } }
  else { const dx=k.tx-k.x, dy=k.ty-k.y, d=Math.hypot(dx,dy);
    if(d<.05){ k.tx=null; if(k.leaving){ toa=null; return; } }
    else { const sp=Math.min(d,dt*(k.leaving?1.8:.85)); k.x+=dx/d*sp; k.y+=dy/d*sp; k.walking=true; k.ph+=dt*7; if(Math.abs(dx)>.02) k.dir=dx<0?-1:1; } }
}
function drawToa(items,c,t,time){
  const k=toa; if(!k) return;
  items.push({y:k.y,d:()=>{ const im=TOA_IMG; if(!im.complete||!im.naturalWidth) return;
    const h=t*1.55, w=h*im.naturalWidth/im.naturalHeight, bob=k.walking?Math.abs(Math.sin(k.ph))*t*.07:Math.sin(time*2)*t*.02, tilt=k.walking?Math.sin(k.ph)*.06:0;
    c.fillStyle="rgba(0,0,0,.15)"; c.beginPath(); c.ellipse(k.x*t,k.y*t+t*.04,w*.32,t*.08,0,0,Math.PI*2); c.fill();
    c.save(); c.translate(k.x*t,k.y*t-bob); c.rotate(tilt); c.scale(k.dir,1); c.drawImage(im,-w/2,-h,w,h); c.restore();
    const top=k.y*t-h-bob-2, fs=Math.max(11,t*.3); label(c,"또아",k.x*t,top,fs,"#d6336c");
    const b=bubbles.get("toa"); if(b&&b.until>Date.now()){ const age=Date.now()-b.at, a=age<BUBBLE_HOLD+1500?1:Math.max(0,1-(age-BUBBLE_HOLD-1500)/BUBBLE_FADE);
      c.save(); c.globalAlpha=a; drawBubble(c,b.text,k.x*t,top-fs-4,t); c.restore(); } }});
}
function toaTap(fx,fy){
  const k=toa; if(!k||k.leaving) return false;
  if(!(Math.abs(k.x-fx)<.8&&fy>k.y-1.6&&fy<k.y+.3)) return false;
  k.tx=null; k.wait=6; k.dir=W.map.x<k.x?-1:1; sayBubble("toa","딸기 있어요? 🍓");
  openSheet("🍓 또아",`<div class="guide"><img src="${TOA_IMG.src}" alt="또아" style="height:110px"><h2>딸기를 줄까요?</h2><p>가진 딸기 ${inv("straw")}개</p></div>
    <div class="row"><button class="btn sub grow" id="toaNo">아니오</button><button class="btn grow" id="toaYes">네</button></div>`,w=>{
    w.querySelector("#toaYes").onclick=()=>{
      if(inv("straw")<1){ closeSheet(); sayBubble("toa","딸기가 없구나… 괜찮아요!"); toast("딸기가 없어요. 밭에 딸기를 심어보세요 🍓"); SFX.no(); return; }
      addInv("straw",-1); addInv("milk",1); S.toaGiven=k.slot; save(); closeSheet();
      sayBubble("toa","고마워요! 답례로 우유를 드릴게요 🥛"); for(let i=0;i<8;i++) sparkles.push({x:k.x,y:k.y-.8,vx:(Math.random()-.5)*1.6,vy:-Math.random()*1.6,life:1,color:"#ff7fa0"});
      [784,988,1175,1568].forEach((f,i)=>tone(f,.22,{at:i*.09,vol:.06,type:"triangle"})); logAct("또아에게 딸기 주기");
      toast("🍓 딸기를 주고 🥛 우유 1개를 받았어요!");
      setTimeout(()=>{ if(toa===k){ k.leaving=true; k.tx=PATH_X+.5; k.ty=MR-.6; } },2500); };
    w.querySelector("#toaNo").onclick=()=>{ closeSheet(); sayBubble("toa","다음에 또 올게요~"); k.wait=2; };
  });
  return true;
}

function stepPipi(dt,time){
  if(where!=="map"){ return; }
  const today=kstDate(Date.now());
  if(S.pipiDate!==today){ S.pipiDate=today; S.pipiCount=0; }
  if(!pipi){
    if((S.pipiCount||0)>=2) return;
    if(!pipiNextAt){ pipiNextAt=time+20+Math.random()*40; return; }
    if(time<pipiNextAt) return;
    const me=W.map; let sx=me.x+4, sy=me.y+3;
    for(let i=0;i<30;i++){ const a=Math.random()*Math.PI*2, x=me.x+Math.cos(a)*5, y=me.y+Math.sin(a)*4, k=tileKind(Math.floor(x),Math.floor(y)); if(k==="grass"||k==="path"){ sx=x; sy=y; break; } }
    pipi={x:sx,y:sy,tx:null,wait:0,dir:1,ph:0,beepAt:time+.5,quiet:false,leaving:false,leaveAt:time+150,walking:false};
    S.pipiCount=(S.pipiCount||0)+1; save(); toast(`📢 삐삐가 나타났어요! (오늘 ${S.pipiCount}번째)`);
  }
  const k=pipi;
  if(!k.leaving&&time>k.leaveAt){ k.leaving=true; k.tx=PATH_X+.5; k.ty=MR-.6; }
  if(!k.quiet&&!k.leaving&&time>k.beepAt){ pipiBeep(); sayBubble("pipi","삐삐삐삐!"); k.beepAt=time+4+Math.random()*3; }
  if(k.tx==null){ k.wait-=dt; k.walking=false;
    if(k.wait<=0){ for(let i=0;i<20;i++){ const x=Math.max(1.5,Math.min(MC-2,k.x+(Math.random()-.5)*10)), y=Math.max(3,Math.min(MR-2,k.y+(Math.random()-.5)*8)), kd=tileKind(Math.floor(x),Math.floor(y));
      if(kd==="path"||kd==="grass"||kd==="bridge"){ k.tx=x; k.ty=y; break; } } k.wait=1.5+Math.random()*3; } }
  else { const dx=k.tx-k.x, dy=k.ty-k.y, d=Math.hypot(dx,dy);
    if(d<.05){ k.tx=null; if(k.leaving){ pipi=null; pipiNextAt=time+300+Math.random()*300; return; } }
    else { const sp=Math.min(d,dt*(k.leaving?2:1.1)); k.x+=dx/d*sp; k.y+=dy/d*sp; k.walking=true; k.ph+=dt*9; if(Math.abs(dx)>.02) k.dir=dx<0?-1:1; } }
}

// ---------- 집 여러 채: 층 올리기 · 옆으로 넓히기 · 울타리 ----------
const upCost=lv=>12+8*lv, wingCost=w=>14+10*w, FENCE_COST=6, newHouseCost=n=>12*(n+1);
function housesOf(o){ if(o&&Array.isArray(o.houses)&&o.houses.length) return o.houses; const h=(o&&o.house)||{mat:null,level:0}; return [{...h,lot:0}]; }
const floorsOf=(o,i)=>Math.max(1,((housesOf(o)[i]||{}).level)||1);
const MAX_HOUSES=4;
// 집 자리: 직접 고른 자리(pos)가 있으면 그곳, 없으면 예전 집터
function lotOf(h,i){ return (h&&h.pos)||LOTS[(h&&h.lot!=null)?h.lot:i]||LOTS[0]; }
function houseDoor(h,i){ const L=lotOf(h,i); return {x:L.x+1,y:L.y+2}; }
function houseAt(o,x,y){ const hs=housesOf(o);
  for(let i=0;i<hs.length;i++){ const h=hs[i]; if(!h.mat) continue; const L=lotOf(h,i); if(!L) continue;
    const w=3+Math.min(2,h.wing||0); if(x>=L.x&&x<L.x+w&&y>=L.y&&y<L.y+2) return i;
    const d=houseDoor(h,i); if(x===d.x&&y===d.y) return i; }
  return -1; }
// 집을 지을 수 있는 칸인지 (풀밭, 밭·나무·물·길·다른 집 없음)
function tileFree(x,y,ignore){
  if(x<1||y<1||x>MC-2||y>MR-2) return false;
  const k=tileKind(x,y); if(k!=="grass"&&k!=="lot") return false;
  if(fieldOf(S)[x+","+y]) return false;
  const hi=houseAt(S,x,y); if(hi>=0&&hi!==ignore) return false;
  if(garageAt(S,x,y)) return false;
  if(Math.floor(W.map.x)===x&&Math.floor(W.map.y)===y&&false) return false;
  return true; }
function canPlaceHouse(x0,y0,ignore,w=3){
  for(let yy=y0;yy<y0+2;yy++) for(let xx=x0;xx<x0+w;xx++) if(!tileFree(xx,yy,ignore)) return false;
  const dx=x0+1, dy=y0+2, dk=tileKind(dx,dy);
  if(["water","tree","pen","house","out"].includes(dk)) return false;
  const hi=houseAt(S,dx,dy); if(hi>=0&&hi!==ignore) return false;
  return true; }

function siren(){ [0,.36,.72].forEach(a=>{ tone(920,.3,{at:a,type:"square",vol:.03}); tone(690,.3,{at:a+.18,type:"square",vol:.03}); }); }
async function stealAt(x,y){
  const o=owner(), k=x+","+y, f=fieldOf(o)[k]; if(!visitId||!f||plotState(f).stage!=="ready") return;
  const c=CROPS[f.crop], n=c.yield, key=visitId+"|"+k+"|"+f.at; if(myTakes.has(key)) return;
  if(guardOn(o)){ caughtByGuard(o,`${c.item||c.name} 몰래 수확`); return; }
  if(!useEnergy("steal",true)) return;
  const rec={to:visitId,toNick:o.nick,from:docId,fromNick:S.nick,crop:f.crop,n,key:k,plantedAt:f.at,at:Date.now(),applied:false,seen:false};
  myTakes.set(key,rec); addInv(f.crop,n); if(f.crop==="rice") addInv("hay",2);
  sel=null; save(); SFX.harvest(); siren(); puff(x+.5,y+.4,"#ffd84d"); sayBubble(docId,"🚓 삐뽀삐뽀!");
  logAct(`${o.nick}님 ${c.item||c.name} ${n}개 몰래 수확`); toast(`${c.item||c.name} ${n}개를 몰래 수확했어요! 🚓 경찰이 출동했대요`); renderAct();
  if(mode==="db") db.collection("thefts").add(rec).catch(()=>{});
}
function processThefts(){
  if(!S||mode!=="db") return; let changed=false, fresh=0;
  thefts.forEach(t=>{ if(t.to!==docId||t.applied||handledThefts.has(t.id)) return; handledThefts.add(t.id); fresh++;
    if(t.kind==="animal"){ const i=S.animals.findIndex(a=>a.type===t.animal); if(i>=0){ S.animals.splice(i,1); animsKey=""; changed=true; } db.doc("thefts/"+t.id).update({applied:true}).catch(()=>{}); return; }
    const f=S.field&&S.field[t.key];
    if(f&&f.at===t.plantedAt){ const c=CROPS[f.crop]; if(c&&c.regrow){ f.at=t.at; f.dur=c.regrow; } else delete S.field[t.key]; changed=true; }
    db.doc("thefts/"+t.id).update({applied:true}).catch(()=>{}); });
  if(changed) save();
  if(fresh&&inboxShown){ siren(); if($("sheetwrap").hidden) policeSheet(); else toast("🚓 경찰 출동! 메뉴 › 알림에서 확인하세요"); }
  updateInboxBadge();
}

const LURE_FOOD={chicken:"rice",cow:"hay",sheep:"apple",cat:"milk",dog:"cheese"};
function animalsOf(o){
  const list=o.animals||[]; if(o===S||!thefts.length) return list;
  const pid=idFor(o.nick), take={};
  thefts.forEach(t=>{ if(t.kind==="animal"&&t.to===pid&&!t.applied) take[t.animal]=(take[t.animal]||0)+1; });
  if(!Object.keys(take).length) return list;
  return list.filter(a=>{ if(take[a.type]>0){ take[a.type]--; return false; } return true; });
}

function shrinkImage(file,maxSide=1000,q=.62){ return new Promise((res,rej)=>{
  const fr=new FileReader(); fr.onerror=()=>rej(new Error("파일을 읽지 못했어요"));
  fr.onload=()=>{ const im=new Image(); im.onerror=()=>rej(new Error("사진을 열지 못했어요"));
    im.onload=()=>{ let w=im.width, h=im.height; const sc=Math.min(1,maxSide/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(im,0,0,w,h);
      let url=cv.toDataURL("image/jpeg",q); if(url.length>450000){ const s2=700/Math.max(w,h); const c2=document.createElement("canvas"); c2.width=Math.round(w*s2); c2.height=Math.round(h*s2); c2.getContext("2d").drawImage(cv,0,0,c2.width,c2.height); url=c2.toDataURL("image/jpeg",.5); }
      res(url); }; im.src=fr.result; }; fr.readAsDataURL(file); }); }

  ${["head","face","neck","hand","body"].map(sl=>`<h2>${{head:"머리",face:"얼굴",neck:"목",hand:"손",body:"옷"}[sl]}</h2><div class="closet">${Object.entries(ACC).filter(([,a])=>a.slot===sl).map(([k,a])=>{
    const own=S.owned.includes(k), on=c[sl]===k;
    return `<button class="acc" data-a="${k}" aria-pressed="${on}"><svg viewBox="0 0 100 122">${charSVG({...c,head:sl==="head"?k:null,face:sl==="face"?k:null,neck:sl==="neck"?k:null,hand:sl==="hand"?k:null,body:sl==="body"?k:null})}</svg>${a.name}<span class="p">${own?(on?"착용 중":"착용하기"):a.craft?"만들기로 얻어요":"🪙"+a.price}</span></button>`}).join("")}</div>`).join("")}`;
  v.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{ c.base=b.dataset.b; SFX.tap(); save(); render(); });
  v.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ c.color=b.dataset.c; SFX.tap(); save(); render(); });
  v.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.a, a=ACC[k];
    if(!S.owned.includes(k)){
      if(a.craft){ bagSheet("craft"); return; }
      openSheet(a.name+" 사기",`<div style="width:130px;margin:0 auto">${charImg({...c,[a.slot]:k})}</div><button class="btn" id="buyAcc">🪙 ${a.price}에 사서 착용하기</button>`,
        w=>w.querySelector("#buyAcc").onclick=()=>{ if(!pay(a.price)) return; S.owned.push(k); c[a.slot]=k; logAct(`${a.name} 사서 착용`); save(); closeSheet(); render(); toast(`${a.name}을(를) 착용했어요`); });
      return;
    }
    c[a.slot]=c[a.slot]===k?null:k; SFX.tap(); save(); render();
  });
}

// =====================================================================
// 이웃 + 방문 + 방명록
// =====================================================================
function vNeighbors(v){
  if(mode!=="db") return sharedOnly(v);
  const list=players.filter(p=>p.nick&&idFor(p.nick)!==docId&&(isOwnerView||shown(idFor(p.nick)))).sort((a,b)=>(onlineIds.has(idFor(b.nick))-onlineIds.has(idFor(a.nick))));
  v.innerHTML=`<div class="row"><h2 class="grow">이웃 마을</h2><button class="btn sm sub" id="nbWorld">🗺 전체지도</button></div>${list.length?`<div class="list">${list.map(p=>{ const on=onlineIds.has(idFor(p.nick)); return `<button class="neighbor" data-v="${esc(idFor(p.nick))}">${charImg(p.char||{})}<span class="grow"><b style="font-family:var(--display);font-weight:400;font-size:17px">${esc(p.nick)}</b> · ${esc(p.village)}${on?` <span class="on">● 접속 중</span>`:""}<br><span class="note">${isAway(p)&&!on?esc(awayText(p))+" · ":""}${p.house&&p.house.mat?`${MATS[p.house.mat]} ${p.house.level||1}층${housesOf(p).filter(h=>h.mat).length>1?` 외 ${housesOf(p).filter(h=>h.mat).length-1}채`:""}`:"집 짓는 중"} · 동물 ${(p.animals||[]).length}마리 · ${on?"지금 함께 있어요":ago(p.updatedAt||0)+" 접속"}</span></span>${siteHidden.has(idFor(p.nick))?`<span class="chip">숨김</span>`:`<span class="btn sm">찾아가기</span>`}</button><button class="btn sm sub hidebtn" data-dmto="${esc(idFor(p.nick))}">💌 비밀 채팅</button>${isOwnerView?`<button class="btn sm sub hidebtn" data-hide="${esc(idFor(p.nick))}">${siteHidden.has(idFor(p.nick))?"다시 보이기":"모두에게 숨기기"}</button>`:""}`}).join("")}</div>
    ${isOwnerView?`<p class="note">마을 주인만 보이는 버튼이에요. 숨긴 사람은 다른 사람 화면(전체지도, 이웃, 채팅, 함께 있는 캐릭터)에서 사라지고, 그 사람이 키운 마을과 기록은 그대로 남아요.</p>`:""}`
    :`<p class="note">아직 이웃이 없어요. 이 페이지 링크를 가족, 친구에게 보내주세요.</p>`}`;
  v.querySelector("#nbWorld").onclick=()=>{ tab="village"; enterWorld(); renderTabs(); };
  v.querySelectorAll("[data-hide]").forEach(b=>b.onclick=()=>toggleHidden(b.dataset.hide));
  v.querySelectorAll("[data-dmto]").forEach(b=>b.onclick=()=>openDm(b.dataset.dmto));
  v.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{
    if(siteHidden.has(b.dataset.v)){ toast("숨긴 사람의 마을이에요. 다시 보이기를 누르면 찾아갈 수 있어요"); return; }
    const target=villages().find(x=>x.p.pid===b.dataset.v); if(!target) return;
    roadTrip(target); });
}

async function toggleHidden(pid){
  if(!isOwnerView) return;
  const ref=db.doc("config/site");
  try{ const sn=await ref.get(); const cfg=sn.exists?JSON.parse(JSON.stringify(sn.data())):{};
    const h=new Set(Array.isArray(cfg.hidden)?cfg.hidden:[]); const was=h.has(pid); was?h.delete(pid):h.add(pid);
    await ref.set({...cfg,hidden:[...h]}); siteHidden=h; render(); SFX.tap(); toast(was?"다시 모두에게 보여요":"모두에게 숨겼어요"); }
  catch(e){ toast("바꾸지 못했어요 ("+((e&&e.code)||"error")+")"); }
}

// =====================================================================
// 교환 게시판
// =====================================================================
const TRADEABLE=["coin",...Object.keys(ITEMS)];
function vTrade(v){
  if(mode!=="db") return sharedOnly(v);
  const open=offers.filter(o=>o.status==="open");
  v.innerHTML=`<div class="card" style="display:flex;flex-direction:column;gap:8px">
    <h2>교환 올리기</h2>
    <span class="lbl">내가 줄 것</span>
    <div class="row"><select id="gItem" class="grow">${TRADEABLE.map(k=>`<option value="${k}">${itemIc(k)} ${itemName(k)} (가진 것 ${ownedCount(k)})</option>`).join("")}</select><input id="gQty" type="number" min="1" value="1" style="width:76px"></div>
    <span class="lbl">받고 싶은 것</span>
    <div class="row"><select id="wItem" class="grow">${TRADEABLE.map(k=>`<option value="${k}" ${k==="rice"?"selected":""}>${itemIc(k)} ${itemName(k)}</option>`).join("")}</select><input id="wQty" type="number" min="1" value="1" style="width:76px"></div>
    <button class="btn" id="postOffer">게시판에 올리기</button>
    <p class="note">올리는 순간 줄 물건은 맡겨두고, 누가 받아주면 받고 싶은 것이 자동으로 들어와요.</p>
  </div>
  <h2>교환 게시판</h2>
  ${open.length?`<div class="list">${open.map(o=>{ const mine=o.seller===docId; return `<div class="item"><span class="grow"><span class="nm">${esc(o.sellerNick)}</span><br>
    <span>${itemIc(o.give.item)} ${itemName(o.give.item)} ${o.give.qty} → ${itemIc(o.want.item)} ${itemName(o.want.item)} ${o.want.qty}</span><br><span class="sub">${ago(o.createdAt)}</span></span>
    ${mine?`<button class="btn sm sub" data-cancel="${o.id}">내리기</button>`:`<button class="btn sm" data-take="${o.id}">교환하기</button>`}</div>`; }).join("")}</div>`
    :`<p class="note">아직 올라온 교환이 없어요.</p>`}`;
  v.querySelector("#postOffer").onclick=postOffer;
  v.querySelectorAll("[data-take]").forEach(b=>b.onclick=()=>takeOffer(b.dataset.take));
  v.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>cancelOffer(b.dataset.cancel));
}
async function postOffer(){
  const g=$("gItem").value, gq=Math.max(1,parseInt($("gQty").value)||1), w=$("wItem").value, wq=Math.max(1,parseInt($("wQty").value)||1);
  if(g===w){ toast("서로 다른 것을 골라주세요"); return; }
  if(!has(g,gq)){ toast(`${itemName(g)}이(가) 모자라요`); SFX.no(); return; }
  try{
    addInv(g,-gq); save(); await flush();
    await db.collection("offers").add({seller:docId,sellerNick:S.nick,give:{item:g,qty:gq},want:{item:w,qty:wq},status:"open",createdAt:Date.now()});
    SFX.coin(); toast("교환을 올렸어요"); render();
  }catch(e){ addInv(g,gq); save(); toast("올리지 못했어요. 쓰기 권한을 확인해주세요"); }
}
async function takeOffer(id){
  const ref=db.doc("offers/"+id);
  try{
    const snap=await ref.get(); const o=snap.exists?snap.data():null;
    if(!o||o.status!=="open"){ toast("이미 끝난 교환이에요"); return; }
    if(!has(o.want.item,o.want.qty)){ toast(`${itemName(o.want.item)}이(가) ${o.want.qty}개 필요해요`); SFX.no(); return; }
    const lock=await ref.acquire({holder:docId,ttlMs:8000});
    if(!lock.acquired){ toast("다른 사람이 교환 중이에요. 잠시 후 다시 해보세요"); return; }
    await ref.update({status:"taken",buyer:docId,buyerNick:S.nick,takenAt:Date.now()});
    addInv(o.want.item,-o.want.qty); addInv(o.give.item,o.give.qty); save();
    SFX.coin(); logAct(`${o.sellerNick}님과 교환`); toast(`${itemName(o.give.item)} ${o.give.qty}개를 받았어요`);
    try{ await db.collection("chat").add({from:"system",nick:"게시판",text:`${S.nick}님이 ${o.sellerNick}님과 ${itemName(o.give.item)} ↔ ${itemName(o.want.item)} 교환을 했어요`,at:Date.now()}); }catch(e){}
  }catch(e){ toast("교환하지 못했어요. 쓰기 권한을 확인해주세요"); }
}
async function cancelOffer(id){
  const o=offers.find(x=>x.id===id); if(!o||o.status!=="open") return;
  try{ await db.doc("offers/"+id).update({status:"cancelled"}); addInv(o.give.item,o.give.qty); save(); toast("교환을 내리고 물건을 돌려받았어요"); }
  catch(e){ toast("내리지 못했어요"); }
}
let settling=new Set();
async function settleOffers(){
  if(!S) return;
  for(const o of offers){
    if(o.seller!==docId||o.status!=="taken"||settling.has(o.id)) continue;
    settling.add(o.id);
    try{ await db.doc("offers/"+o.id).update({status:"done"}); addInv(o.want.item,o.want.qty); save(); SFX.coin();
      toast(`${o.buyerNick}님과 교환했어요! ${itemName(o.want.item)} ${o.want.qty}개가 들어왔어요`); if(tab!=="chat") render(); }
    catch(e){ settling.delete(o.id); }
  }
}

// =====================================================================
// 채팅
// =====================================================================
async function sendChat(text){
  text=text.slice(0,200); sayBubble(docId,text);
  if(mode!=="db") return true;
  try{ await db.collection("chat").add({from:docId,nick:S.nick,text,at:Date.now()}); logAct("채팅"); return true; }
  catch(err){ toast("보내지 못했어요. 쓰기 권한을 확인해주세요"); return false; }
}
// 채팅은 내가 들어온 뒤(함께 접속해 있는 동안) 나눈 말만 보여요
let chatSince=Date.now();
const liveChats=()=>chats.filter(m=>(m.at||0)>=chatSince&&(!m.from||m.from==="system"||shown(m.from)));
const chatListHTML=()=>liveChats().length?liveChats().map(m=>m.from==="system"?`<p class="note" style="text-align:center">${esc(m.text)}</p>`
    :`<div class="msg ${m.from===docId?"mine":""}">${m.from===docId?"":`<span class="who">${esc(m.nick)}</span>`}${esc(m.text)}</div>`).join(""):`<p class="note">지금 마을에 들어와 있는 사람들과 나누는 대화만 보여요. 들어오기 전의 대화는 보이지 않고, 나갔다 오면 새로 시작해요. 첫 인사를 건네보세요 👋</p>`;
function renderChatList(){ if(chatMode!=="all"){ renderTabs(); return; } const l=document.querySelector("#view .chat"); if(!l){ render(); return; } l.innerHTML=chatListHTML(); $("view").scrollTop=1e9; }
// ---------- 💌 비밀 채팅: 고른 사람과 둘만, 지워지지 않고 계속 남아요 ----------
let chatMode="all", dmWith=null, dms=[], dmIn=[], dmOut=[];
const dmPeople=()=>players.filter(p=>p.nick&&idFor(p.nick)!==docId&&shown(idFor(p.nick)));
const dmThread=pid=>dms.filter(m=>(m.from===docId&&m.to===pid)||(m.from===pid&&m.to===docId)).sort((a,b)=>a.at-b.at);
function dmUnread(pid){ const seen=(S.dmSeen||{})[pid]||0; return dms.filter(m=>m.from===pid&&m.to===docId&&m.at>seen).length; }
function dmUnreadTotal(){ if(!S) return 0; const by=new Set(dms.filter(m=>m.to===docId).map(m=>m.from)); let n=0; by.forEach(pid=>n+=dmUnread(pid)); return n; }
function markDmSeen(pid){ const th=dmThread(pid); if(!th.length) return; S.dmSeen=S.dmSeen||{}; const last=th[th.length-1].at; if((S.dmSeen[pid]||0)<last){ S.dmSeen[pid]=last; save(); } }
function onDmSnapshot(){
  const before=onDmSnapshot.lastIn||0; dms=[...dmIn,...dmOut];
  const newest=dmIn.reduce((m,x)=>Math.max(m,x.at||0),0);
  if(onDmSnapshot.ready&&newest>before){ const m=dmIn.find(x=>x.at===newest);
    if(m&&!(tab==="chat"&&chatMode==="dm"&&dmWith===m.from)){ SFX.chat(); toast(`💌 ${m.fromNick}님의 비밀 메시지: ${m.text.slice(0,30)}`); } }
  onDmSnapshot.lastIn=Math.max(before,newest); onDmSnapshot.ready=true;
  if(tab==="chat"&&chatMode==="dm"){ if(dmWith){ markDmSeen(dmWith); renderDmThread(); } else render(); }
  renderTabs(); updateInboxBadge();
}
function dmThreadHTML(pid){
  const th=dmThread(pid);
  return th.length?th.map(m=>`<div class="msg ${m.from===docId?"mine":""}">${esc(m.text)}<span class="who" style="text-align:right">${ago(m.at)}</span></div>`).join("")
    :`<p class="note">아직 나눈 비밀 메시지가 없어요. 둘만 볼 수 있는 대화예요.</p>`;
}
function renderDmThread(){ const l=document.querySelector("#view .dmchat"); if(!l){ render(); return; } l.innerHTML=dmThreadHTML(dmWith); $("view").scrollTop=1e9; }
function openDm(pid){ chatMode="dm"; dmWith=pid; closeSheet(); if(tab!=="chat") go("chat"); else render(); }
async function sendDm(text){
  const p=players.find(x=>idFor(x.nick)===dmWith); if(!p) return false;
  try{ await db.collection("dms").add({from:docId,fromNick:S.nick,to:dmWith,toNick:p.nick,text:text.slice(0,300),at:Date.now()}); logAct(`${p.nick}님께 비밀 메시지`); return true; }
  catch(e){ toast("보내지 못했어요. 잠시 뒤 다시 해주세요"); return false; }
}
function vChat(v){
  if(mode!=="db") return sharedOnly(v);
  const un=dmUnreadTotal();
  const seg=`<div class="seg"><button data-cm="all" aria-pressed="${chatMode==="all"}">💬 모두</button><button data-cm="dm" aria-pressed="${chatMode==="dm"}">💌 비밀 채팅${un?` (${un})`:""}</button></div>`;
  if(chatMode==="all"){
    v.innerHTML=`${seg}<div class="chat" style="padding-bottom:64px">${chatListHTML()}</div>
      <form class="composer" id="chatForm"><input id="chatIn" maxlength="200" autocomplete="off" placeholder="마을 사람들에게 한마디"><button class="btn sm" type="submit">보내기</button></form>`;
    v.querySelector("#chatForm").onsubmit=async e=>{ e.preventDefault(); const inp=v.querySelector("#chatIn"), t=inp.value.trim(); if(!t) return; inp.value=""; if(!await sendChat(t)) inp.value=t; };
  } else if(!dmWith){
    const ppl=dmPeople().map(p=>{ const pid=idFor(p.nick), th=dmThread(pid), last=th[th.length-1]; return {p,pid,last,un:dmUnread(pid)}; })
      .sort((a,b)=>((b.last&&b.last.at)||0)-((a.last&&a.last.at)||0));
    v.innerHTML=`${seg}<p class="note">말 걸 사람을 골라요. 비밀 채팅은 둘만 보이고, 지워지지 않고 계속 남아요.</p>
      ${ppl.length?`<div class="list">${ppl.map(x=>`<button class="neighbor" data-dm="${esc(x.pid)}">${charImg(x.p.char||{})}<span class="grow"><b style="font-family:var(--display);font-weight:400;font-size:17px">${esc(x.p.nick)}</b>${onlineIds.has(x.pid)?` <span class="on">● 접속 중</span>`:""}<br><span class="note">${x.last?`${x.last.from===docId?"나: ":""}${esc(x.last.text.slice(0,28))} · ${ago(x.last.at)}`:"아직 대화가 없어요"}</span></span>${x.un?`<span class="chip" style="background:var(--berry);color:#fff;border-color:var(--berry)">${x.un}</span>`:""}</button>`).join("")}</div>`:`<p class="note">아직 마을에 다른 사람이 없어요.</p>`}`;
    v.querySelectorAll("[data-dm]").forEach(b=>b.onclick=()=>{ SFX.tap(); dmWith=b.dataset.dm; render(); });
  } else {
    const p=players.find(x=>idFor(x.nick)===dmWith)||{nick:"친구"}; markDmSeen(dmWith);
    v.innerHTML=`${seg}<div class="row"><button class="btn sm sub" id="dmBack">← 목록</button><b class="grow" style="font-family:var(--display);font-weight:400;font-size:17px">💌 ${esc(p.nick)}님과 비밀 채팅</b>${onlineIds.has(dmWith)?`<span class="on">● 접속 중</span>`:""}</div>
      <div class="dmchat chat" style="padding-bottom:64px">${dmThreadHTML(dmWith)}</div>
      <form class="composer" id="dmForm"><input id="dmIn" maxlength="300" autocomplete="off" placeholder="${esc(p.nick)}님에게만 보이는 말"><button class="btn sm" type="submit">보내기</button></form>`;
    v.querySelector("#dmBack").onclick=()=>{ dmWith=null; render(); };
    v.querySelector("#dmForm").onsubmit=async e=>{ e.preventDefault(); const inp=v.querySelector("#dmIn"), t=inp.value.trim(); if(!t) return; inp.value=""; if(!await sendDm(t)) inp.value=t; };
  }
  v.querySelectorAll("[data-cm]").forEach(b=>b.onclick=()=>{ SFX.tap(); chatMode=b.dataset.cm; render(); setTimeout(()=>{ $("view").scrollTop=1e9; },30); });
}

// =====================================================================
// 시계: 작물 자람, 동물 울음
// =====================================================================
const grownSeen={};
let nextCry=Date.now()+15000;
let sleepTick=0, yawnAt=0;
setInterval(()=>{
  if(!S) return;
  settleLure();
  if(jailed()&&tab==="village"&&(visitId!==myJail().owner||where!=="map"||Math.hypot(W.map.x-JAIL.x,W.map.y-JAIL.y-.2)>.9)&&!isMoving(W.map)) enforceJail();
  if(tab==="village"&&where==="room"&&resting){ setEnergy(energy()+(resting==="bed"?(visitId?100/60:100/20):.4)); /* 침대: 우리 집 20초, 친구 집 1분이면 0→100 */ if(++sleepTick%10===0) save(); }
  if(energy()<1&&!buffOn()&&isMoving(W[where])&&Date.now()>yawnAt){ yawnAt=Date.now()+7000; sayBubble(docId,"하암~ 배고파요 😪"); }
  updateEnergyUI();
  Object.entries(S.field||{}).forEach(([i,p])=>{
    const key=p.crop+":"+p.at, st=plotState(p);
    if(st.stage!=="ready") grownSeen[i]="g"+key;
    else if(grownSeen[i]==="g"+key){ grownSeen[i]="r"+key; SFX.grown(); toast(`${CROPS[p.crop].item||CROPS[p.crop].name}이(가) 다 자랐어요!`); if(tab==="village") renderAct(); }
    else grownSeen[i]="r"+key;
  });
  if(Date.now()>nextCry&&S.animals.length&&!document.hidden){
    const i=Math.floor(Math.random()*S.animals.length); voice(S.animals[i].type);
    if(tab==="village"&&where==="map"&&!visitId&&anims[i]) anims[i].say=1.6;
    nextCry=Date.now()+25000+Math.random()*25000;
  }
  if(tab==="village"){ const at=$("actTime"); if(at&&sel){ const f=fieldOf(owner())[sel.x+","+sel.y]; if(f) at.textContent=fmt(plotState(f).left); } }
  else if(tab==="rest"){ const rt=$("restTime"); if(rt&&S.rest) rt.textContent=fmt((Date.now()-S.rest.since)/1000); }
},1000);
document.addEventListener("visibilitychange",()=>{ if(document.hidden&&dirty) flush(); });
</script>
