<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a9d574">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// =====================================================================
// 워니의숲 독립 버전: Claude 대신 Firebase에 저장하고 접속을 표시하는 다리
// =====================================================================
// ▼ Firebase 콘솔 > 프로젝트 설정 > 내 앱(웹)에서 복사한 값을 여기에 넣어요
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDwaxCw1HEM185oou2zI2LHrAO2tsLcr7k",
  authDomain: "wonies-forest.firebaseapp.com",
  projectId: "wonies-forest",
  storageBucket: "wonies-forest.firebasestorage.app",
  messagingSenderId: "374155503580",
  appId: "1:374155503580:web:aa83b99c9ecb681ee95119"
};
// ▼ 이 닉네임으로 들어온 사람이 마을 주인 (대시보드, 숨기기, 문 닫기)
const OWNER_NICK = "이혜원숭이";

(function(){
  const configured=FIREBASE_CONFIG.apiKey&&!FIREBASE_CONFIG.apiKey.startsWith("여기")&&window.firebase;
  let fs=null, prefix=null, resolveDb, dbPromise=new Promise(r=>resolveDb=r);
  if(configured){
    try{ firebase.initializeApp(FIREBASE_CONFIG); fs=firebase.firestore(); fs.settings({ignoreUndefinedProperties:true,merge:true}); }catch(e){ console.error(e); fs=null; }
  }
  const P=p=>`villages/${prefix}/${p}`;
  const err=e=>({code:e&&e.code==="permission-denied"?"not_granted":(e&&e.code)||"error",message:e&&e.message});
  const snapDoc=d=>({id:d.id,exists:d.exists,data:()=>d.exists?d.data():undefined,metadata:{}});
  const wrapSnap=s=>({docs:s.docs.map(snapDoc),size:s.size,empty:s.empty,docChanges:()=>[],metadata:{}});
  function wrapQ(q){ return {
    where:(f,op,v)=>wrapQ(q.where(f,op,v)), orderBy:(f,d)=>wrapQ(q.orderBy(f,d||"asc")), limit:n=>wrapQ(q.limit(n)),
    get:async()=>{ try{ return wrapSnap(await q.get()); }catch(e){ throw err(e); } },
    onSnapshot:(next,onErr)=>q.onSnapshot(s=>next(wrapSnap(s)),e=>onErr&&onErr(err(e))) }; }
  function docRef(path){ const r=fs.doc(P(path)); return {
    id:r.id, path,
    get:async()=>{ try{ return snapDoc(await r.get()); }catch(e){ throw err(e); } },
    set:async d=>{ try{ await r.set(d); }catch(e){ throw err(e); } },
    update:async d=>{ try{ await r.update(d); }catch(e){ throw err(e); } },
    delete:async()=>{ try{ await r.delete(); }catch(e){ throw err(e); } },
    // 교환할 때 두 사람이 동시에 누르는 걸 막는 짧은 잠금
    acquire:async({holder,ttlMs=8000})=>{ try{ return await fs.runTransaction(async tx=>{
      const s=await tx.get(r), l=s.exists&&s.data()._lock;
      if(l&&l.exp>Date.now()&&l.holder!==holder) return {acquired:false,holder:l.holder};
      tx.set(r,{_lock:{holder,exp:Date.now()+ttlMs}},{merge:true}); return {acquired:true}; }); }catch(e){ throw err(e); } },
    onSnapshot:(next,onErr)=>r.onSnapshot(s=>next(snapDoc(s)),e=>onErr&&onErr(err(e))),
    collection:p=>col(path+"/"+p) }; }
  function col(path){ const c=fs.collection(P(path)); const q=wrapQ(c);
    q.path=path; q.doc=id=>docRef(path+"/"+(id||c.doc().id));
    q.add=async d=>{ try{ const r=await c.add(d); return docRef(path+"/"+r.id); }catch(e){ throw err(e); } };
    return q; }
  const db={ doc:docRef, collection:col };

  // 지금 함께 있는 사람: presence 문서에 위치를 남기고 1분 안에 갱신한 사람만 보여줌
  function makeRoom(){
    let me=null, lastWrite=0, pend=null, peers=[], handlers=[], unsub=null;
    const pc=()=>fs.collection(P("presence"));
    const write=()=>{ pend=null; if(!me||!me.id) return; lastWrite=Date.now(); pc().doc(me.id).set({...me,ts:Date.now()}).catch(()=>{}); };
    const fresh=()=>peers.filter(p=>Date.now()-(p.ts||0)<70000);
    let prevIds=new Set();
    const emit=()=>{ const list=fresh(), ids=new Set(list.map(p=>p.id));
      const wrap=p=>({presence:p,peer:p.id,by:null,isMe:me&&p.id===me.id,sameTab:false,kind:"viewer",guest:false,updatedAt:p.ts});
      const joined=list.filter(p=>!prevIds.has(p.id)).map(wrap), left=[...prevIds].filter(id=>!ids.has(id)).map(id=>({presence:{id}}));
      prevIds=ids; handlers.forEach(h=>{ try{ h({peers:list.map(wrap),joined,left,updated:[]}); }catch(e){} }); };
    setInterval(()=>{ if(me&&me.id) write(); emit(); },25000);
    addEventListener("pagehide",()=>{ if(me&&me.id) pc().doc(me.id).delete().catch(()=>{}); });
    return {
      async presence(patch){
        if(patch&&patch.id===null){ if(me&&me.id) pc().doc(me.id).delete().catch(()=>{}); me=null; return; }
        me={...(me||{}),...patch};
        const wait=1500-(Date.now()-lastWrite);
        if(wait<=0) write(); else if(!pend) pend=setTimeout(write,wait);
      },
      onPeers(h){ handlers.push(h);
        if(!unsub) unsub=pc().onSnapshot(s=>{ peers=s.docs.map(d=>d.data()); emit(); },()=>{});
        return ()=>{ handlers=handlers.filter(x=>x!==h); }; },
      peers(){ return fresh(); }, emit:async()=>{}, on:()=>()=>{} };
  }
  let room=null;
  const user={
    isOwner:async()=>!!(typeof S!=="undefined"&&S&&S.nick===OWNER_NICK),
    canEdit:async()=>!!(typeof S!=="undefined"&&S&&S.nick===OWNER_NICK),
    can:async()=>true,
    id:async()=>typeof docId!=="undefined"?docId:null
  };

  // 입구 비밀번호는 서버 규칙이 확인함: 맞으면 읽기가 되고, 틀리면 거절됨
  window.__gateCheck=async pw=>{
    if(!fs){ const e=document.getElementById("gateErr"); if(e) e.textContent="마을 서버 설정이 아직 안 됐어요. 마을 주인에게 알려주세요."; return false; }
    if(!pw||/[\/]/.test(pw)) return false;
    try{ prefix=pw; await fs.doc(P("config/site")).get(); resolveDb(db); return true; }
    catch(e){ prefix=null; return false; }
  };
  window.claude={ use(name){
    if(name==="db") return fs?dbPromise:Promise.resolve(null);
    if(name==="room") return dbPromise.then(d=>d?(room=room||makeRoom()):null);
    if(name==="user") return Promise.resolve(user);
    return Promise.resolve(null);
  }};
  document.addEventListener("DOMContentLoaded",()=>{ const n=document.getElementById("connNote"); if(n) n.textContent=fs?"입구 비밀번호를 넣으면 마을에 연결돼요.":"마을 서버 설정이 아직 안 됐어요."; });
})();
</script>
</head><body>
<title>🏕워니의숲</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 휴대폰 한 손 게임. 위 상태바, 가운데 화면(마을·시장·쉬기·꾸미기·이웃·교환·채팅), 아래 탭바 */
:root{
  --sky:#d4ebf5; --grass:#a9d574; --grass-d:#6fa845; --soil:#9a6a45; --soil-d:#6f4a2e;
  --paper:#fffaf0; --card:#ffffff; --ink:#3b2f24; --muted:#8a7a68; --line:#eadfcb;
  --berry:#e2566f; --honey:#f2b632; --water:#7cc3e6; --leaf:#4f8a2e;
  --display:"Jua","BM JUA","Apple SD Gothic Neo",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-size:15px;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.screen{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(var(--sky) 0 55%,var(--grass) 55% 100%)}
.panel{background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:20px;width:100%;max-width:400px;
  display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 rgba(59,47,36,.08)}
.logo{font-family:var(--display);font-size:40px;margin:0;color:var(--soil-d);text-align:center;line-height:1.1}
.logo small{display:block;font-size:15px;color:var(--muted);font-family:var(--body);margin-top:6px}
.lbl{font-size:13px;color:var(--muted)}
.btn{background:var(--berry);color:#fff;border:0;border-radius:14px;padding:12px 16px;font-family:var(--display);font-size:17px;
  box-shadow:0 4px 0 #b13e54}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b13e54}
.btn.sub{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.sm{font-size:14px;padding:7px 12px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.err{color:var(--berry);font-size:13px;min-height:1em;margin:0}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:0}

/* 게임 */
#game{height:var(--appH,100%);display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--paper)}
.top{display:flex;align-items:center;gap:8px;padding-block:8px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  background:var(--paper);border-bottom:2px solid var(--line)}
.top .me{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.top .me b{font-family:var(--display);font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coin{font-family:var(--display);background:#fff3cf;border:2px solid var(--honey);border-radius:999px;padding:3px 10px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.iconbtn{background:#fff;border:2px solid var(--line);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;font-size:16px;padding:0;flex:none}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:12px 16px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}
nav.tabs{display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border-top:2px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{background:none;border:0;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);position:relative}
nav.tabs button .i{font-size:20px;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current="page"]::after{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--berry)}
.dot{position:absolute;top:4px;right:20%;width:8px;height:8px;border-radius:50%;background:var(--berry)}
h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.seg{display:flex;background:#f3ead8;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:14px}
.seg button[aria-pressed="true"]{background:#fff;font-weight:700;box-shadow:0 1px 0 var(--line)}

/* 마을 장면 */
.yard{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(#cfe9f4 0 34%,var(--grass) 34%);
  border:2px solid var(--line);padding:10px;display:grid;grid-template-columns:1.2fr 1fr;gap:6px;align-items:end;min-height:190px}
.yard .sign{position:absolute;top:8px;left:10px;font-family:var(--display);background:#fff;border:2px solid var(--soil);
  border-radius:10px;padding:2px 10px;font-size:14px;color:var(--soil-d)}
.house{cursor:pointer;background:none;border:0;padding:0}
.house svg{width:100%;max-width:200px;display:block}
.charbox svg{width:100%;max-width:120px;display:block;margin:0 auto}
.pen{background:#c9e59c;border:3px dashed #8bbf5c;border-radius:18px;padding:8px;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;min-height:64px}
.animal{position:relative;background:none;border:0;font-size:28px;padding:4px 0;animation:bob 2.4s ease-in-out infinite}
.animal:nth-child(2n){animation-delay:-1.1s}
.animal .ready{position:absolute;top:-6px;right:-2px;font-size:15px;background:#fff;border-radius:999px;padding:1px 3px;border:2px solid var(--honey)}
.animal .say{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:12px;background:#fff;border:2px solid var(--line);
  border-radius:10px;padding:2px 7px;white-space:nowrap;font-family:var(--display)}
.pen .empty{grid-column:1/-1;font-size:13px;color:#5d7f3e;text-align:center;align-self:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.field{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plot{aspect-ratio:1;max-width:100%;border:0;border-radius:16px;background:var(--soil);box-shadow:inset 0 -6px 0 var(--soil-d);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;position:relative;padding:4px}
.plot.locked{background:#cdbfa6;box-shadow:inset 0 -6px 0 #b3a387;color:#6b5d48}
.plot .ic{font-size:30px;line-height:1}
.plot .t{font-size:11px;font-variant-numeric:tabular-nums}
.plot .bar{width:70%;height:5px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.plot .bar i{display:block;height:100%;background:#c8f08a}
.plot.ready{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 -6px 0 var(--soil-d),0 0 0 4px #ffe58a}}
.inv{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 9px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* 목록 */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.item .ic{font-size:26px;width:34px;text-align:center;flex:none}
.item .nm{font-weight:700}
.item .sub{font-size:12px;color:var(--muted)}
.price{font-family:var(--display);white-space:nowrap}

/* 시트 */
.sheetwrap{position:fixed;inset:0;background:rgba(40,30,20,.35);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:86%;overflow-y:auto;border-radius:22px 22px 0 0;
  padding-block:16px max(18px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:9px 16px;border-radius:999px;font-size:14px;z-index:40;max-width:90%;text-align:center;transition:opacity .3s}

/* 꾸미기 */
.closet{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.acc{background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.acc svg{width:64px;height:64px}
.acc[aria-pressed="true"]{border-color:var(--berry);background:#fff0f2}
.acc .p{font-family:var(--display);font-size:13px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--berry)}
.bases{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bases button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px;font-size:12px}
.bases button svg{width:100%;height:auto;max-height:70px}
.bases button[aria-pressed="true"]{border-color:var(--berry);background:#fff0f2}

/* 쉬기 */
.rest svg.scene{width:100%;height:auto;display:block;border-radius:20px;border:2px solid var(--line)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px}
.acts button .i{font-size:22px}
.acts button[aria-pressed="true"]{border-color:#5aa6d6;background:#eaf6fd}
.ripple{animation:rip 3s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes rip{from{transform:scale(.6);opacity:.9}to{transform:scale(1.6);opacity:0}}
.flow{animation:flow 6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-60}}
.zz{animation:zz 3s ease-in-out infinite;font-family:var(--display)}
@keyframes zz{50%{opacity:.3;transform:translateY(-4px)}}

/* 채팅 */
.chat{display:flex;flex-direction:column;gap:6px}
.msg{max-width:82%;align-self:flex-start;background:#fff;border:2px solid var(--line);border-radius:14px 14px 14px 4px;padding:6px 10px;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:#fff0c9;border-color:#f2d27a;border-radius:14px 14px 4px 14px}
.msg .who{font-size:11px;color:var(--muted);display:block}
.composer{display:flex;gap:8px}
/* 글 쓰는 동안: 화면은 그대로, 입력창만 키보드 바로 위로 */
.composer.typing{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:50;background:var(--paper);border-top:2px solid var(--line);
  padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));box-shadow:0 -4px 12px rgba(59,47,36,.08)}
.composer input{flex:1;min-width:0}
.neighbor{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px;text-align:left;width:100%}
.neighbor svg{width:56px;height:auto;flex:none}
.hidebtn{align-self:flex-end;margin-top:-4px}
.note-card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px}
.note-card b{font-family:var(--display);font-weight:400;color:var(--soil-d)}
.note-card span{overflow-wrap:anywhere;white-space:pre-wrap}
.note-card time{font-size:11px;color:var(--muted)}
/* 대시보드 */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:12px;color:var(--muted)}
.tile b{font-family:var(--display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;background:#fff;border:2px solid var(--line);border-radius:14px}
table.dash{border-collapse:collapse;width:100%;min-width:480px;font-size:13px}
table.dash th{text-align:left;font-weight:700;color:var(--muted);font-size:12px;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
table.dash td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
table.dash tr[data-row]{cursor:pointer}
table.dash tr.detail td{background:#fbf6ea;font-size:12px;line-height:1.7}
table.dash time{color:var(--muted);margin-right:6px}
/* 안내 카드 */

    <ellipse cx="50" cy="63" rx="17" ry="13" fill="#f0d3a8"/>`;
  if(base==="chestnut") return `
    <path d="M25 60 Q25 32 50 22 Q75 32 75 60 Q75 82 50 82 Q25 82 25 60Z" fill="#8b4a2b"/>
    <path d="M47 23 Q50 15 53 23" fill="#8b4a2b"/>

    <path d="M28 70 Q50 84 72 70" fill="none" stroke="#e5c79a" stroke-width="4"/>`;

function accSVG(id){
  switch(id){
    case "straw": return `<ellipse cx="50" cy="30" rx="34" ry="7" fill="#e8c66a"/><path d="M33 30 Q35 12 50 12 Q65 12 67 30Z" fill="#f0d27e"/><rect x="34" y="24" width="32" height="5" fill="#d9485f"/>`;

    case "beanie": return `<path d="M26 40 Q26 14 50 14 Q74 14 74 40Z" fill="#5b8bd9"/><rect x="25" y="36" width="50" height="8" rx="4" fill="#3f6fbf"/><circle cx="50" cy="12" r="6" fill="#fff"/>`;

    case "glasses": return `<circle cx="42" cy="60" r="7" fill="none" stroke="#3b2f24" stroke-width="2"/><circle cx="58" cy="60" r="7" fill="none" stroke="#3b2f24" stroke-width="2"/><path d="M49 60 L51 60" stroke="#3b2f24" stroke-width="2"/>`;
    case "shades": return `<rect x="33" y="55" width="15" height="9" rx="4" fill="#222"/><rect x="52" y="55" width="15" height="9" rx="4" fill="#222"/><path d="M48 58 L52 58" stroke="#222" stroke-width="2"/>`;

    case "beads": return Array.from({length:9},(_,i)=>{const a=Math.PI*(.15+.7*i/8);return `<circle cx="${50-Math.cos(a)*20}" cy="${80+Math.sin(a)*8}" r="2.8" fill="#6b3f1f"/>`}).join("");

// pose: stand | sit | lie(누움) | swim(머리만) | read
function charSVG(c,pose="stand"){
  const robe=COLORS[c.color]||COLORS.gray;
  const closed=pose==="lie"||pose==="sit";
  const head=headSVG(c.base)+faceSVG(closed)+accSVG(c.face)+accSVG(c.head);
  if(pose==="swim") return `<g>${head}</g>`;
  let body;
  if(pose==="stand"){
    body=`<ellipse cx="41" cy="113" rx="7" ry="4" fill="#5c4632"/><ellipse cx="59" cy="113" rx="7" ry="4" fill="#5c4632"/>
      <ellipse cx="50" cy="96" rx="22" ry="19" fill="${robe}"/>`;
  } else {
    body=`<ellipse cx="50" cy="104" rx="28" ry="14" fill="${robe}"/><ellipse cx="50" cy="94" rx="21" ry="16" fill="${robe}"/>`;
  }
  body+=`<path d="M34 84 Q50 96 60 112 L52 112 Q46 98 32 90Z" fill="#f2c46b" opacity=".9"/>`;

  return `<g>${body}${accSVG(c.neck)}${head}${extra}</g>`;
}

    ${win(42,82)}${win(100,82)}${two?win(42,40)+win(100,40):""}

// =====================================================================
// 소리: 배경음악, 효과음, 동물 울음 (모두 합성)
// =====================================================================
let ac=null, master=null, musicGain=null, sfxGain=null;
function audio(){
  try{
    if(!ac){ ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain(); master.gain.value=.9; master.connect(ac.destination);
      musicGain=ac.createGain(); musicGain.gain.value=.6; musicGain.connect(master);
      sfxGain=ac.createGain(); sfxGain.gain.value=1; sfxGain.connect(master); }
    if(ac.state==="suspended") ac.resume();
  }catch(e){}
  return ac;
}
function tone(f,dur,{type="sine",vol=.12,at=0,to=null,dest=null,attack=.01}={}){
  if(!audio()) return; const t=ac.currentTime+at, o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur*.8);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(dest||sfxGain); o.start(t); o.stop(t+dur+.05);
}
const SFX={
  plant(){ tone(420,.18,{to:260,vol:.16}); tone(900,.12,{at:.08,vol:.06}); },
  grown(){ [784,988,1319,1568].forEach((f,i)=>tone(f,.5,{at:i*.09,vol:.09,type:"triangle"})); },
  harvest(){ tone(523,.15,{vol:.12,type:"triangle"}); tone(784,.25,{at:.1,vol:.12,type:"triangle"}); },
  coin(){ tone(1318,.12,{type:"square",vol:.05}); tone(1760,.35,{at:.08,type:"square",vol:.05}); tone(2637,.25,{at:.08,vol:.03}); },
  build(){ [0,.18,.36].forEach(t=>tone(180,.12,{at:t,type:"square",vol:.06,to:120})); [523,659,784,1046].forEach((f,i)=>tone(f,.4,{at:.6+i*.1,vol:.08,type:"triangle"})); },
  tap(){ tone(660,.08,{vol:.06,type:"triangle"}); },
  no(){ tone(200,.2,{type:"square",vol:.05,to:150}); },
  chat(){ tone(1046,.1,{vol:.05}); tone(1318,.12,{at:.06,vol:.05}); },
  note(){ [659,784,1046].forEach((f,i)=>tone(f,.35,{at:i*.12,vol:.07,type:"triangle"})); }
};
function voice(kind){
  if(!audio()) return; const t=ac.currentTime;
  const saw=(f0,path,dur,filt,vol)=>{
    const o=ac.createOscillator(), bp=ac.createBiquadFilter(), g=ac.createGain();
    o.type="sawtooth"; o.frequency.setValueAtTime(f0,t); path.forEach(([f,tt])=>o.frequency.linearRampToValueAtTime(f,t+tt));
    bp.type="bandpass"; bp.frequency.value=filt; bp.Q.value=2.5;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.05); g.gain.setValueAtTime(vol,t+dur*.6); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(bp); bp.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+dur+.05); return o; };
  if(kind==="cat") saw(520,[[820,.16],[700,.35],[460,.6]],.65,1300,.22);
  if(kind==="dog"){ saw(260,[[170,.12]],.16,900,.25); setTimeout(()=>voice("dog2"),220); }
  if(kind==="dog2") saw(270,[[160,.12]],.16,900,.22);
  if(kind==="chicken") [0,.12,.24,.42].forEach((d,i)=>tone(i===3?820:620,i===3?.25:.07,{at:d,type:"square",vol:.05,to:i===3?560:480}));
  if(kind==="cow") saw(150,[[120,.4],[105,1.1]],1.2,600,.3);
  if(kind==="sheep"){ const o=saw(330,[[300,.6]],.7,1100,.22); const l=ac.createOscillator(), lg=ac.createGain(); l.frequency.value=11; lg.gain.value=25; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t+.7); }
}

let music=false, musicTimer=null, beat=0, mNext=0, mIdx=2;
const MEL=[523.25,587.33,659.25,783.99,880,1046.5], BASS=[130.81,110,87.31,98];
function musicTick(){
  if(!ac) return;
  while(mNext<ac.currentTime+.4){
    const at=mNext-ac.currentTime;
    if(beat%8===0){ const b=BASS[(beat/8)%4]; tone(b,3.2,{type:"triangle",vol:.05,at,dest:musicGain,attack:.2}); tone(b*1.5,3,{vol:.025,at,dest:musicGain,attack:.3}); }
    if(Math.random()<.62){ mIdx=Math.max(0,Math.min(MEL.length-1,mIdx+[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)]));
      const f=MEL[mIdx]; tone(f,1.1,{vol:.045,at,dest:musicGain,attack:.005}); tone(f*2,.5,{vol:.008,at,dest:musicGain,attack:.005}); }
    beat++; mNext+=.46;
  }
}

let water=null;
function waterOn(){
  if(water||!audio()) return;
  const len=ac.sampleRate*2, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
  let last=0; for(let i=0;i<len;i++){ last=(last+.02*(Math.random()*2-1))/1.02; d[i]=last*3.5; }
  const src=ac.createBufferSource(); src.buffer=buf; src.loop=true;
  const lp=ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=900;
  const g=ac.createGain(); g.gain.value=0; g.gain.linearRampToValueAtTime(.18,ac.currentTime+2);
  src.connect(lp); lp.connect(g); g.connect(master); src.start(); water={src,g};
}

async function hashPin(nick,pin){
  const txt="dotori:"+nick.trim().toLowerCase()+":"+pin;
  try{ const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt)); return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=5381; for(const ch of txt) h=((h<<5)+h+ch.charCodeAt(0))|0; return "x"+(h>>>0).toString(16); }
}

const MC=32, MR=36, VC=10, VR=12, RC=8, RR=8, WC=12, WR=14;
const HOUSE={x:9,y:6,w:3,h:2}, DOOR={x:10,y:8}, ROOM_DOOR={x:3,y:7};
const PEN={x:2,y:16,w:5,h:4}, PATH_X=10, PATH_Y=13;
const inRect=(r,x,y)=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h;
// 같은 칸이면 늘 같은 값을 주는 난수 (나무, 꽃 자리를 고정)
const hash2=(x,y)=>{ let h=(Math.imul(x,374761393)+Math.imul(y,668265263))>>>0; h=Math.imul(h^(h>>>13),1274126177)>>>0; return ((h^(h>>>16))>>>0)/4294967296; };
const streamX=y=>17.5+1.6*Math.sin(y*.42);
const isPond=(x,y)=>((x+.5-3)/2.7)**2+((y+.5-2.8)/1.9)**2<=1;
const isStream=(x,y)=>Math.abs(x+.5-streamX(y+.5))<1.05;
const isPathT=(x,y)=>(x===PATH_X&&y>DOOR.y)||(y===PATH_Y&&x>=1&&x<=MC-2);
const TREE_SET=new Set();
for(let y=0;y<MR;y++) for(let x=0;x<MC;x++){
  if(x>=7&&x<=13&&y>=4&&y<=10) continue;
  if(isPond(x,y)||isStream(x,y)||isPathT(x,y)||(x>=PEN.x-1&&x<=PEN.x+PEN.w&&y>=PEN.y-1&&y<=PEN.y+PEN.h)) continue;
  if(Math.abs(x-PATH_X)<=1&&y>=MR-2) continue;
  const edge=x<2||x>MC-3||y<2||y>MR-3, p=edge?.42:.06;
  if(hash2(x,y)<p) TREE_SET.add(x+","+y);
}
function tileKind(x,y){
  if(x<0||y<0||x>=MC||y>=MR) return "out";
  if(inRect(HOUSE,x,y)) return "house";
  if(x===DOOR.x&&y===DOOR.y) return "door";
  if(x===PATH_X&&y===MR-1) return "gate";
  const w=isPond(x,y)||isStream(x,y);
  if(w&&isPathT(x,y)) return "bridge";
  if(w) return "water";
  if(inRect(PEN,x,y)) return "pen";
  if(TREE_SET.has(x+","+y)) return "tree";
  if(isPathT(x,y)) return "path";
  return "grass";
}
// 예전 작은 지도에서 심은 밭을 넓은 지도 자리로 옮김
function convertField(field){
  const out={}, used=new Set();
  Object.entries(field||{}).forEach(([k,f])=>{
    let [x,y]=k.split(",").map(Number); x+=8; y+=5;
    let best=null;
    for(let r=0;r<6&&!best;r++) for(let dy=-r;dy<=r&&!best;dy++) for(let dx=-r;dx<=r&&!best;dx++){
      const nx=x+dx, ny=y+dy; if(tileKind(nx,ny)==="grass"&&!used.has(nx+","+ny)) best=nx+","+ny; }
    if(best){ used.add(best); out[best]=f; }
  });
  return out;
}

const BUBBLE_HOLD=2000, BUBBLE_FADE=2000;
function sayBubble(id,text){ bubbles.set(id,{text,at:Date.now(),until:Date.now()+BUBBLE_HOLD+BUBBLE_FADE}); }
function wrapText(c,text,maxW){
  const lines=[]; let cur="";
  for(const ch of text){ if(c.measureText(cur+ch).width>maxW&&cur){ lines.push(cur); cur=ch; if(lines.length===2) break; } else cur+=ch; }
  if(lines.length<2&&cur) lines.push(cur); else if(lines.length===2&&cur&&text.length>lines.join("").length) lines[1]=lines[1].slice(0,-1)+"…";
  return lines;
}
function drawBubble(c,text,x,bottom,t){
  const fs=Math.max(12,t*.32); c.font=`${fs}px "Gowun Dodum",sans-serif`;
  const lines=wrapText(c,text,Math.max(110,t*3.6)), lh=fs*1.25;
  const bw=Math.max(...lines.map(l=>c.measureText(l).width))+16, bh=lines.length*lh+10;
  let bx=x-bw/2; bx=Math.max(camOX+4,Math.min(bx,camOX+G.w-bw-4)); const by=bottom-bh-6;
  c.fillStyle="rgba(0,0,0,.12)"; c.beginPath(); c.roundRect(bx+1,by+2,bw,bh,10); c.fill();
  c.fillStyle="#fff"; c.beginPath(); c.roundRect(bx,by,bw,bh,10); c.fill();
  c.beginPath(); c.moveTo(x-6,by+bh-1); c.lineTo(x+6,by+bh-1); c.lineTo(x,by+bh+6); c.fill();
  c.strokeStyle="#eadfcb"; c.lineWidth=1.5; c.beginPath(); c.roundRect(bx,by,bw,bh,10); c.stroke();
  c.fillStyle="#3b2f24"; c.textAlign="center"; c.textBaseline="top";
  lines.forEach((l,i)=>c.fillText(l,bx+bw/2,by+5+i*lh));
}
// 같은 곳에 있는 친구들 (실시간 위치)
const peerPos=new Map();
function updatePeers(list){
  const seen=new Set();
  list.forEach(p=>{ const pr=p.presence||{}; if(!pr.id||pr.id===docId||!pr.scene) return; seen.add(pr.id);
    const cur=peerPos.get(pr.id)||{x:pr.x,y:pr.y};
    peerPos.set(pr.id,{...cur,tx:pr.x,ty:pr.y,nick:pr.nick,char:pr.char,scene:pr.scene,at:pr.at,pose:pr.pose||"stand"}); });
  [...peerPos.keys()].forEach(k=>{ if(!seen.has(k)) peerPos.delete(k); });
}
function peersHere(){
  const here=visitId||docId, out=[];
  peerPos.forEach((p,id)=>{ if(shown(id)&&p.scene===where&&(where==="world"||p.at===here)) out.push({id,...p}); });
  return out;
}
function stepPeers(dt){
  peerPos.forEach(p=>{ if(p.tx==null) return; const dx=p.tx-p.x, dy=p.ty-p.y, d=Math.hypot(dx,dy);
    if(d>6){ p.x=p.tx; p.y=p.ty; p.walking=false; } else if(d>.02){ const sp=Math.min(d,dt*3.2); p.x+=dx/d*sp; p.y+=dy/d*sp; p.walking=true; } else p.walking=false; });
}
function pushPeers(items,c,t,time,scale=1){
  peersHere().forEach(p=>items.push({y:p.y,d:()=>drawChar(c,p.char,p.x*t,p.y*t,t*scale,{walking:p.walking,time,name:p.nick,id:p.id,pose:p.pose})}));
}
let lastPres=0, lastPresKey="";
function sharePosition(now){
  if(!roomCap||!S||now-lastPres<350) return;
  const w=W[where], scene=tab==="village"?where:null;
  const key=[scene,visitId||docId,w.x.toFixed(2),w.y.toFixed(2),resting||""].join("|");
  if(key===lastPresKey) return; lastPres=now; lastPresKey=key;
  roomCap.presence({id:docId,nick:S.nick,char:S.char,scene,at:visitId||docId,x:+w.x.toFixed(2),y:+w.y.toFixed(2),pose:resting?"sit":"stand"}).catch(()=>{});
}

  const cv=$("map"), w=cv.parentElement.clientWidth, t=w/cols, dpr=Math.min(2,devicePixelRatio||1);
  cv.style.width=w+"px"; cv.style.height=t*rows+"px"; cv.width=Math.round(w*dpr); cv.height=Math.round(t*rows*dpr);
  const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  G={cv,ctx,t,w,h:t*rows};
  cv.setAttribute("aria-label",where==="world"?"전체지도. 마을을 누르면 걸어서 찾아가요":where==="room"?"집 안. 바닥을 누르면 걸어가요":"마을. 땅을 누르면 걸어가요");
  // 마을 지도: 끌면 옆으로 둘러보고, 짧게 누르면 그곳으로 걸어감
  let drag=null, pinch=null; const pts=new Map();
  const rel=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  cv.onpointerdown=e=>{ audio(); const p=rel(e);
    if(where!=="map"){ (where==="room"?tapRoom:tapWorld)(p.x/t,p.y/t); return; }
    pts.set(e.pointerId,p); try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.zoom}; drag=null; }
    else if(pts.size===1) drag={x:p.x,y:p.y,cx:cam.x,cy:cam.y,moved:false}; };
  cv.onpointermove=e=>{ if(!pts.has(e.pointerId)) return; const p=rel(e); pts.set(e.pointerId,p);
    if(pinch&&pts.size>=2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); zoomAt(pinch.z*d/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2); return; }
    if(!drag) return; const dx=p.x-drag.x, dy=p.y-drag.y;
    if(!drag.moved&&Math.hypot(dx,dy)>8) drag.moved=true;
    if(drag.moved){ const tz=t*cam.zoom; cam.follow=false; cam.x=drag.cx-dx/tz; cam.y=drag.cy-dy/tz; clampCam(); } };
  const end=e=>{ pts.delete(e.pointerId);
    if(pinch){ if(pts.size<2) pinch=null; if(pts.size===1){ const p=[...pts.values()][0]; drag={x:p.x,y:p.y,cx:cam.x,cy:cam.y,moved:true}; } return; }
    if(!drag) return; const d=drag; drag=null;
    if(!d.moved&&e.type==="pointerup"){ const p=rel(e), tz=t*cam.zoom; tapMap(cam.x+p.x/tz, cam.y+p.y/tz); } };
  cv.onpointerup=end; cv.onpointercancel=end;
  cv.onwheel=e=>{ if(where!=="map") return; e.preventDefault(); const p=rel(e); zoomAt(cam.zoom*(e.deltaY<0?1.12:1/1.12),p.x,p.y); };
  const zb=v.querySelector("#zoomBtns"); if(zb) zb.onclick=e=>{ const b=e.target.closest("[data-z]"); if(!b) return; SFX.tap();

  if(where==="map"&&needSnap){ needSnap=false; snapCam(); cam.follow=false; }
  const q=id=>v.querySelector("#"+id);
  if(q("toWorld")) q("toWorld").onclick=()=>{ SFX.tap(); cam.follow=true; walkTo(W.map,[[PATH_X+.5,W.map.y],[PATH_X+.5,MR-.5]],()=>enterWorld()); sel=null; renderAct(); };
  if(q("goHome")) q("goHome").onclick=()=>{ SFX.tap(); travelHome(); };
  if(q("gbWrite")) q("gbWrite").onclick=()=>guestbookSheet(o);
  if(q("notesBtn")) q("notesBtn").onclick=notesSheet;
  if(q("buildBtn")) q("buildBtn").onclick=houseSheet;
  q("talkForm").onsubmit=e=>{ e.preventDefault(); const inp=q("talkIn"), t=inp.value.trim(); if(!t) return; inp.value=""; sendChat(t); inp.blur(); };
  renderAct(); startLoop();
}

// ---------- 아래 행동 안내 ----------
function renderAct(){
  const a=$("actbar"); if(!a||tab!=="village") return;
  const o=owner(), visiting=!!visitId;
  let h="";
  if(where==="world"){
    h=isMoving(W.world)?`<span class="grow">길을 따라 걸어가는 중…</span>`:`<span class="grow">가고 싶은 마을을 누르면 걸어서 찾아가요.</span>`;
  } else if(where==="room"){
    if(placing) h=`<span class="grow">${FURN[placing.k].name}을(를) 놓을 ${FURN[placing.k].wall?"벽":"바닥"}을 눌러주세요</span><button class="btn sm sub" id="cancelPlace">그만두기</button>`;
    else if(resting) h=`<span class="grow">${resting==="bed"?"침대에 누워 쉬는 중이에요 💤":"편하게 앉아 쉬는 중이에요"}</span><button class="btn sm sub" id="getUp">일어나기</button>`;
    else h=`<span class="grow">${visiting?(isAway(o)&&!onlineIds.has(visitId)?esc(awayText(o)):"집 안을 구경해요."):roomOf(S).length?"가구를 누르면 옮기거나 써볼 수 있어요.":"아직 텅 비어 있어요. 가구를 놓아보세요!"}</span>
      ${visiting?"":`<button class="btn sm" id="addFurn">가구 놓기</button>`}<button class="btn sm sub" id="leaveRoom">밖으로</button>`;
  } else if(!sel){
    h=`<span class="grow">${visiting?"마을을 걸어다니며 구경해요.":"땅을 누르면 그곳으로 걸어가요. 빈 땅에서 농사를 지을 수 있어요."}</span>`;
  } else if(isMoving(W.map)){
    h=`<span class="grow">걸어가는 중…</span>`;
  } else {
    const k=sel.x+","+sel.y, f=fieldOf(o)[k], kind=tileKind(sel.x,sel.y);
    if(f){ const st=plotState(f), c=CROPS[f.crop];
      if(st.stage==="ready") h=visiting?`<span class="grow">${c.ic} ${c.item||c.name}가 잘 익었어요</span>`:`<span class="grow">${c.ic} ${c.item||c.name} 다 자랐어요!</span><button class="btn sm" id="harvest">수확하기</button>`;
      else h=`<span class="grow">${c.ic} ${c.name} · <span id="actTime">${fmt(st.left)}</span> 남음</span>${visiting?"":`<button class="btn sm sub" id="dig">뽑기</button>`}`;
    } else if(kind==="grass"&&!visiting){
      const used=Object.keys(fieldOf(S)).length, max=S.fieldMax||6;
      h=used>=max?`<span class="grow">밭은 ${max}칸까지 쓸 수 있어요. 시장에서 밭을 늘릴 수 있어요.</span>`
        :`<div class="grow"><div class="note" style="margin-bottom:6px">여기에 무엇을 심을까요? (밭 ${used}/${max})</div><div class="cropbtns">${Object.entries(CROPS).map(([ck,c])=>`<button class="btn sm sub" data-plant="${ck}">${c.ic} ${c.name} 🪙${c.cost}</button>`).join("")}</div></div>`;
    } else h=`<span class="grow">${{water:"졸졸 흐르는 개울이에요.",pen:"동물 우리예요.",tree:"커다란 나무예요.",gate:"마을 입구예요. 전체지도로 나갈 수 있어요.",grass:"풀밭이에요."}[kind]||"여기는 지나갈 수 있어요."}</span>`;
  }
  a.innerHTML=h;
  const b=id=>a.querySelector("#"+id);
  a.querySelectorAll("[data-plant]").forEach(x=>x.onclick=()=>plantAt(sel.x,sel.y,x.dataset.plant));
  if(b("harvest")) b("harvest").onclick=()=>harvestAt(sel.x,sel.y);
  if(b("dig")) b("dig").onclick=()=>{ delete S.field[sel.x+","+sel.y]; save(); renderAct(); };
  if(b("addFurn")) b("addFurn").onclick=furnSheet;
  if(b("leaveRoom")) b("leaveRoom").onclick=()=>{ resting=null; walkTo(W.room,[[ROOM_DOOR.x+.5,ROOM_DOOR.y+.5]],leaveRoom); };
  if(b("cancelPlace")) b("cancelPlace").onclick=()=>{ if(placing.from==="new") S.furnStore[placing.k]=(S.furnStore[placing.k]||0)+1; else if(placing.item) S.room.push(placing.item); placing=null; save(); renderAct(); };
  if(b("getUp")) b("getUp").onclick=()=>{ resting=null; W.room.y+=.6; renderAct(); };

// ---------- 마을 지도 ----------
function tapMap(fx,fy){
  const x=Math.floor(fx), y=Math.floor(fy), o=owner(), visiting=!!visitId;
  // 그림 친구에게 인사
  if(kidTap(fx,fy)) return;
  // 길강아지·길고양이
  if(stray&&!visiting&&Math.hypot(stray.x-fx,stray.y-fy)<.95){ walkTo(W.map,[[stray.x+(stray.x<W.map.x?.9:-.9),stray.y+.1]]); strayTap(); return; }
  // 동물
  for(let i=0;i<anims.length;i++){ const a=anims[i]; if(Math.hypot(a.x-fx,a.y-fy)<.6){
    walkTo(W.map,[[Math.min(Math.max(fx,0.5),PEN.x-.4),fy]]); if(!visiting) animalTap(i); else voice(a.type); a.say=1.6; return; } }
  const kind=tileKind(x,y);
  if(kind==="house"||kind==="door"){ sel=null; walkTo(W.map,[[DOOR.x+.5,DOOR.y+.5]],enterRoom); renderAct(); return; }
  if(kind==="gate"){ sel=null; walkTo(W.map,[[PATH_X+.5,MR-.5]],enterWorld); renderAct(); return; }
  if(kind==="out") return;
  sel={x,y}; SFX.tap();
  const k=x+","+y, f=fieldOf(o)[k];
  walkTo(W.map,[[x+.5,y+.62]],()=>{ if(!visiting&&f&&plotState(f).stage==="ready") harvestAt(x,y); renderAct(); });
  renderAct();
}
function plantAt(x,y,ck){
  const c=CROPS[ck]; if(S.coins<c.cost){ toast(`동전이 ${c.cost-S.coins}개 모자라요`); SFX.no(); return; }
  S.coins-=c.cost; S.field=S.field||{}; S.field[x+","+y]={crop:ck,at:Date.now(),dur:c.time};
  SFX.plant(); puff(x+.5,y+.5,"#8a5a3b"); logAct(`${c.name} 심기`); save(); renderTop(); renderAct(); toast(`${c.name}을(를) 심었어요`);
}
function harvestAt(x,y){
  const k=x+","+y, f=S.field[k]; if(!f||plotState(f).stage!=="ready") return;
  const c=CROPS[f.crop]; addInv(f.crop,c.yield);
  if(c.regrow){ f.at=Date.now(); f.dur=c.regrow; } else delete S.field[k];
  SFX.harvest(); puff(x+.5,y+.4,"#ffd84d"); logAct(`${c.item||c.name} 수확`); save(); toast(`${c.item||c.name} ${c.yield}개 수확!`);
  render();
}
function animalTap(i){
  const a=S.animals[i]; if(!a) return; const A=ANIMALS[a.type];
  voice(a.type);
  if(animalReady(a)){
    if(A.product==="coin"){ const n=5+Math.floor(Math.random()*11); S.coins+=n; SFX.coin(); toast(`${A.name}가 동전 ${n}개를 물어왔어요`); }
    else { addInv(A.product,1); SFX.harvest(); toast(`${ITEMS[A.product].name} 1개를 얻었어요`); }
    a.at=Date.now(); save(); render();
  }
}
function animalReady(a){ return (Date.now()-a.at)/1000>=ANIMALS[a.type].every; }
function plotState(p){ const el=(Date.now()-p.at)/1000, pr=Math.min(1,el/p.dur); return {stage:pr>=1?"ready":"grow",pr,left:p.dur-el}; }
function puff(x,y,color){ for(let i=0;i<10;i++) sparkles.push({x,y,vx:(Math.random()-.5)*2,vy:-Math.random()*2,life:1,color}); }
function syncAnims(o){
  const key=(o.animals||[]).map(a=>a.type).join(",")+"|"+(visitId||"");
  if(key===animsKey) return; animsKey=key;
  anims=(o.animals||[]).map((a,i)=>({type:a.type,i,x:PEN.x+.6+Math.random()*(PEN.w-1.2),y:PEN.y+.6+Math.random()*(PEN.h-1.2),tx:null,ty:null,wait:Math.random()*3,say:0}));
}
function enterRoom(){ where="room"; placing=null; resting=null; W.room.x=ROOM_DOOR.x+.5; W.room.y=ROOM_DOOR.y+.3; W.room.path=[]; SFX.tap(); render(); }
function leaveRoom(){ where="map"; W.map.x=DOOR.x+.5; W.map.y=DOOR.y+.8; W.map.path=[]; needSnap=true; render(); }

function drawMap(c,t,time,dt){
  const o=owner(); syncAnims(o);
  const x0=Math.max(0,Math.floor(cam.x)-1), x1=Math.min(MC,Math.ceil(cam.x+viewW())+1), y0=Math.max(0,Math.floor(cam.y)-1), y1=Math.min(MR,Math.ceil(cam.y+viewH())+1);
  // 바닥
  for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){
    const k=tileKind(x,y), h=hash2(x,y), px=x*t, py=y*t;
    const g=h<.5?"#a7d36f":"#a2cf6a"; c.fillStyle=k==="pen"?((x+y)%2?"#c4e39a":"#bddc92"):g; c.fillRect(px,py,t+.6,t+.6);
    if(k==="water"||k==="bridge"){
      c.fillStyle="#7cc3e6"; c.fillRect(px,py,t+.6,t+.6);
      c.strokeStyle="rgba(255,255,255,.55)"; c.lineWidth=1.5; const off=((time*10+h*40)%t);
      c.beginPath(); c.moveTo(px+off*.5,py+t*(.3+h*.4)); c.lineTo(px+off*.5+t*.28,py+t*(.3+h*.4)); c.stroke();
      // 물가 테두리
      [[0,-1],[1,0],[0,1],[-1,0]].forEach(([dx,dy])=>{ const n=tileKind(x+dx,y+dy); if(n!=="water"&&n!=="bridge"&&n!=="out"){ c.fillStyle="rgba(90,150,190,.45)";
        if(dy===-1) c.fillRect(px,py,t,3); if(dy===1) c.fillRect(px,py+t-3,t,3); if(dx===-1) c.fillRect(px,py,3,t); if(dx===1) c.fillRect(px+t-3,py,3,t); } });
      if(k==="bridge"){ rr(c,px-1,py+t*.12,t+2,t*.76,3,"#b07a46"); c.strokeStyle="#8a5a33"; c.lineWidth=1.2;
        for(let i=1;i<5;i++){ c.beginPath(); c.moveTo(px+i*t/5,py+t*.12); c.lineTo(px+i*t/5,py+t*.88); c.stroke(); }
        c.fillStyle="#7a4a2a"; c.fillRect(px,py+t*.08,t,3); c.fillRect(px,py+t*.86,t,3); }
      continue;
    }
    if(k==="path"||k==="gate"||k==="door"){
      c.fillStyle="#dcc596"; c.fillRect(px,py,t+.6,t+.6);
      c.fillStyle="rgba(150,115,70,.25)"; for(let i=0;i<3;i++){ const a=hash2(x*3+i,y*7); c.beginPath(); c.arc(px+t*(.2+.6*a),py+t*(.2+.6*hash2(y+i,x)),t*.04,0,Math.PI*2); c.fill(); }
      continue;
    }
    if(k==="grass"){
      if(h>.9){ const cols=["#f7a6b8","#ffd36b","#fff","#b9a3ef"]; for(let i=0;i<3;i++){ c.fillStyle=cols[(i+Math.floor(h*40))%4]; c.beginPath(); c.arc(px+t*(.2+.25*i),py+t*(.3+.2*((i*7)%3)),t*.06,0,Math.PI*2); c.fill(); } }

    rr(c,x*t+t*.06,y*t+t*.1,t*.88,t*.82,t*.18,"#8a5a3b"); c.strokeStyle="#6f4a2e"; c.lineWidth=1;

  if(sel){ c.setLineDash([4,3]); c.strokeStyle="#fff"; c.lineWidth=2; c.strokeRect(sel.x*t+2,sel.y*t+2,t-4,t-4); c.setLineDash([]); }
  // 물고기가 뛰어오름

    [0,1].forEach(j=>{ const age=time-f.t0-j*1.05; if(age>0&&age<.55){ c.strokeStyle=`rgba(255,255,255,${.9-age*1.6})`; c.lineWidth=1.5;
      c.beginPath(); c.ellipse((f.x+f.dir*(j-.5)*.8*1)*t,f.y*t,t*(.12+age*.6),t*(.05+age*.22),0,0,Math.PI*2); c.stroke(); } }); });
  // 그릴 것들 (아래에 있는 게 앞으로)
  const items=[];
  items.push({y:HOUSE.y+HOUSE.h,d:()=>{ const im=houseSprite(o.house); const w=(HOUSE.w+.6)*t, h=w*120/160;
    if(im.complete&&im.naturalWidth) c.drawImage(im,(HOUSE.x-.3)*t,(HOUSE.y+HOUSE.h)*t-h+t*.15,w,h); }});
  TREE_SET.forEach(key=>{ const [x,y]=key.split(",").map(Number); if(x<x0-1||x>x1||y<y0-1||y>y1+1) return; const h=hash2(y,x);
    items.push({y:y+1,d:()=>{ const px=x*t, py=y*t, sway=Math.sin(time*1.2+x)*t*.02;
      c.fillStyle="rgba(0,0,0,.15)"; c.beginPath(); c.ellipse(px+t/2,py+t*.92,t*.36,t*.1,0,0,Math.PI*2); c.fill();
      if(h<.55){ rr(c,px+t*.42,py+t*.45,t*.16,t*.5,2,"#7a5232");
        c.fillStyle="#5f9e3a"; c.beginPath(); c.arc(px+t/2+sway,py+t*.32,t*.44,0,Math.PI*2); c.fill();
        c.fillStyle="#6fae45"; c.beginPath(); c.arc(px+t*.38+sway,py+t*.24,t*.24,0,Math.PI*2); c.fill();
        if(h<.15){ c.fillStyle="#e2445c"; [[.3,.35],[.62,.22],[.58,.48]].forEach(([a,b])=>{ c.beginPath(); c.arc(px+t*a+sway,py+t*b,t*.05,0,Math.PI*2); c.fill(); }); } }
      else { rr(c,px+t*.44,py+t*.62,t*.12,t*.32,2,"#6b4426");
        c.fillStyle="#3f7d3a"; [[.0,.62],[.16,.42],[.32,.22]].forEach(([dy,wd],i)=>{ c.beginPath(); c.moveTo(px+t/2+sway*(i+1),py+t*(-.12+dy)); c.lineTo(px+t*(.5-wd)+sway,py+t*(.36+dy)); c.lineTo(px+t*(.5+wd)+sway,py+t*(.36+dy)); c.fill(); }); } }}); });
  anims.forEach(a=>{
    if(a.tx==null||Math.hypot(a.tx-a.x,a.ty-a.y)<.05){ a.wait-=dt; if(a.wait<=0){ a.tx=PEN.x+.6+Math.random()*(PEN.w-1.2); a.ty=PEN.y+.6+Math.random()*(PEN.h-1.2); a.wait=2+Math.random()*4; } }
    else { const dx=a.tx-a.x, dy=a.ty-a.y, d=Math.hypot(dx,dy), sp=Math.min(d,dt*.7); a.x+=dx/d*sp; a.y+=dy/d*sp; }
    a.say=Math.max(0,a.say-dt);

      const src=(o.animals||[])[a.i]; if(src&&animalReady(src)) emo(c,ANIMALS[a.type].product==="coin"?"🪙":ITEMS[ANIMALS[a.type].product].ic,a.x*t+t*.32,a.y*t-t*.38,t*.3);
      if(a.say>0) label(c,ANIMALS[a.type].say,a.x*t,a.y*t-t*.5,Math.max(11,t*.3)); }});
  });
  const ph=peersHere();
  const away=visitId&&isAway(o)&&!onlineIds.has(visitId);
  if(visitId&&!away&&!ph.some(p=>p.id===visitId)) items.push({y:DOOR.y+.4,d:()=>drawChar(c,o.char,(DOOR.x+1.6)*t,(DOOR.y+.4)*t,t,{name:o.nick,id:visitId})});
  if(away) items.push({y:DOOR.y+.5,d:()=>drawAwaySign(c,o,(DOOR.x+2.6)*t,(DOOR.y+.5)*t,t)});
  pushPeers(items,c,t,time);

  stepKids(dt); drawKids(items,c,t,time);
  const m=W.map; items.push({y:m.y,d:()=>drawChar(c,S.char,m.x*t,m.y*t,t,{walking:isMoving(m),time,name:S.nick,mine:true,id:docId})});
  items.sort((a,b)=>a.y-b.y).forEach(i=>i.d());
  // 하늘을 나는 새
  if(!birds.length) for(let i=0;i<7;i++) birds.push({x:Math.random()*MC,y:Math.random()*MR,vx:(1+Math.random())*(Math.random()<.5?-1:1),vy:(Math.random()-.5)*.4,ph:Math.random()*6});

}

// 하루 한 번 찾아오는 길강아지·길고양이

let stray=null, hearts=[], strayCheckAt=0;
function maybeSpawnStray(time){
  if(stray||visitId||where!=="map"||!S) return;
  const today=kstDate(Date.now());
  if(S.strayDate===today) return;
  if(!strayCheckAt){ strayCheckAt=time+6+Math.random()*10; return; }
  if(time<strayCheckAt) return;
  // 화면 가장자리 쪽 빈 땅에서 나타남
  const me=W.map;
  for(let i=0;i<30;i++){
    const a=Math.random()*Math.PI*2, d=4+Math.random()*2, x=me.x+Math.cos(a)*d, y=me.y+Math.sin(a)*d, k=tileKind(Math.floor(x),Math.floor(y));
    if(k==="grass"||k==="path"){
      const type=Math.random()<.5?"dog":"cat";
      stray={type,x,y,mode:"approach",t:0,dir:1,wait:0,said:0};
      S.strayDate=today; save(); voice(type); logAct(`${type==="dog"?"길강아지":"길고양이"}를 만남`);
      toast(type==="dog"?"어디선가 강아지가 꼬리를 흔들며 다가와요 🐕":"어디선가 고양이가 살금살금 다가와요 🐈");
      return;
    }
  }
}
function stepStray(dt,time){
  maybeSpawnStray(time);
  if(!stray) return;
  const s=stray, me=W.map; s.t+=dt; s.said=Math.max(0,s.said-dt);
  const go=(tx,ty,sp)=>{ const dx=tx-s.x, dy=ty-s.y, d=Math.hypot(dx,dy); if(d<.05) return true; const st=Math.min(d,dt*sp); s.x+=dx/d*st; s.y+=dy/d*st; if(Math.abs(dx)>.02) s.dir=dx<0?1:-1; return false; };
  if(s.mode==="approach"){ if(go(me.x+(s.x<me.x?-.9:.9),me.y+.15,1.6)){ s.mode="idle"; s.said=2; voice(s.type); } }
  else if(s.mode==="idle"){ if(Math.hypot(me.x-s.x,me.y-s.y)>2.2) s.mode="approach"; }
  else if(s.mode==="eat"){ if(s.t>3){ s.mode="idle"; s.said=2; } }
  else if(s.mode==="follow"){
    const tx=me.x+(me.x<s.x?.8:-.8), ty=me.y+.2; go(tx,ty,3.4);
    if(!isMoving(me)&&Math.hypot(me.x-(DOOR.x+.5),me.y-(DOOR.y+1.2))<.3&&s.t>.6) adoptDone();
  }
  else if(s.mode==="flee"){ go(s.fx,s.fy,6); if(s.t>2.2) stray=null; }
}
function drawStray(items,c,t,time){
  hearts=hearts.filter(h=>time-h.t0<1.4);
  if(stray){ const s=stray;
    items.push({y:s.y,d:()=>{
      const happy=s.mode==="idle"||s.mode==="follow"||s.mode==="pet";
      const hop=s.mode==="idle"?Math.abs(Math.sin(time*6))*t*.12:s.mode==="flee"||s.mode==="approach"||s.mode==="follow"?Math.abs(Math.sin(time*14))*t*.06:0;
      const wag=happy?Math.sin(time*(s.mode==="follow"?22:14))*.18:0;
      c.fillStyle="rgba(0,0,0,.15)"; c.beginPath(); c.ellipse(s.x*t,s.y*t+t*.28,t*.28,t*.08,0,0,Math.PI*2); c.fill();
      c.save(); c.translate(s.x*t,s.y*t-hop); c.rotate(wag); c.scale(s.dir,1);
      c.fillStyle="rgba(255,255,255,.85)"; c.beginPath(); c.ellipse(0,t*.05,t*.42,t*.34,0,0,Math.PI*2); c.fill();
      emo(c,s.type==="dog"?"🐕":"🐈",0,0,t*.85); c.restore();
      if(s.mode==="eat"){ emo(c,s.food,s.x*t-s.dir*t*.32,s.y*t+t*.18,t*.3); label(c,"냠냠",s.x*t,s.y*t-t*.5-Math.abs(Math.sin(time*8))*3,Math.max(11,t*.3),"#c2410c"); }
      else if(s.mode==="flee") label(c,s.type==="dog"?"깨갱!":"냐악!",s.x*t,s.y*t-t*.5,Math.max(11,t*.32),"#3b2f24");
      else if(s.mode==="follow") label(c,"살랑살랑",s.x*t,s.y*t-t*.5,Math.max(11,t*.28),"#3b2f24");
      else if(s.said>0) label(c,s.type==="dog"?"멍멍! 🐾":"야옹~ 🐾",s.x*t,s.y*t-t*.55,Math.max(11,t*.3),"#3b2f24");
      else if(s.mode==="idle") label(c,"눌러보세요 👆",s.x*t,s.y*t-t*.55+Math.sin(time*3)*2,Math.max(11,t*.28),"#c2410c");
    }});
  }
  hearts.forEach(h=>{ const a=(time-h.t0)/1.4; items.push({y:999,d:()=>{ c.globalAlpha=1-a; emo(c,"❤️",(h.x+Math.sin(a*6+h.ph)*.15)*t,(h.y-a*1.2)*t,t*(.26+a*.12)); c.globalAlpha=1; }}); });
}
function strayTap(){
  const s=stray; if(!s||s.mode==="flee"||s.mode==="follow") return;
  const name=s.type==="dog"?"강아지":"고양이";
  voice(s.type); s.said=1.5;
  openSheet(`${name}가 애교를 부려요`,`<p class="note">${s.type==="dog"?"꼬리를 흔들며 발치에 앉았어요.":"다리에 몸을 비비며 골골거려요."} 무엇을 해줄까요?</p>
    <div class="acts">
      <button data-st="pet"><span class="i">🤲</span>쓰다듬기</button>
      <button data-st="adopt"><span class="i">🏠</span>집에 데려가서 키우기</button>
      <button data-st="bone"><span class="i">🦴</span>뼈다귀 주기</button>
      <button data-st="churu"><span class="i">🍡</span>츄르 주기</button>
    </div>`,
    w=>w.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{ closeSheet(); strayAct(b.dataset.st); }));
}
function strayAct(act){
  const s=stray; if(!s) return; const name=s.type==="dog"?"강아지":"고양이", now=performance.now()/1000;
  if(act==="pet"){
    s.mode="idle"; s.said=2; for(let i=0;i<7;i++) hearts.push({x:s.x+(Math.random()-.5)*.5,y:s.y-.3,t0:now+i*.12,ph:Math.random()*6});
    [880,1175].forEach((f,i)=>tone(f,.3,{at:i*.1,vol:.06,type:"triangle"})); voice(s.type); logAct(`${name} 쓰다듬기`); return;
  }
  if(act==="adopt"){
    if(S.animals.length>=MAX_ANIMALS){ toast("우리가 꽉 찼어요. 시장에서 팔지 않고는 더 데려올 수 없어요"); SFX.no(); return; }
    s.mode="follow"; s.t=0; cam.follow=true; sel=null;
    walkTo(W.map,[[PATH_X+.5,W.map.y],[PATH_X+.5,DOOR.y+1.2]]);
    toast(`${name}가 꼬리를 흔들며 따라와요`); voice(s.type); renderAct(); return;
  }
  const right=(act==="bone"&&s.type==="dog")||(act==="churu"&&s.type==="cat");
  if(right){ s.mode="eat"; s.t=0; s.food=act==="bone"?"🦴":"🍡";
    [0,.25,.5,.75,1].forEach(d=>tone(260+Math.random()*80,.07,{at:d,type:"square",vol:.03}));
    toast(act==="bone"?"강아지가 뼈다귀를 맛있게 먹어요":"고양이가 츄르를 맛있게 먹어요"); logAct(`${name}에게 ${act==="bone"?"뼈다귀":"츄르"} 주기`); return; }
  // 반대로 주면 반대쪽으로 도망
  const dx=s.x-W.map.x, dy=s.y-W.map.y, d=Math.hypot(dx,dy)||1;
  s.mode="flee"; s.t=0; s.fx=s.x+dx/d*9; s.fy=s.y+dy/d*9; s.dir=dx<0?1:-1;
  tone(900,.25,{to:300,type:"sawtooth",vol:.04}); voice(s.type);
  toast(s.type==="dog"?"강아지는 츄르가 싫었나 봐요. 후다닥 도망갔어요":"고양이는 뼈다귀가 싫었나 봐요. 후다닥 도망갔어요");
  logAct(`${name}가 도망감`);
}
function adoptDone(){
  const s=stray; if(!s) return; stray=null;
  S.animals.push({type:s.type,at:Date.now(),stray:true}); animsKey=""; save();
  SFX.build(); voice(s.type); logAct(`${s.type==="dog"?"강아지":"고양이"}를 데려와 키우기`);

// 마을을 산책하는 그림 친구 둘 (빨강이, 노랑이) — 직접 그린 그림
// =====================================================================
const KIDS=[
  {key:"red", legY:.69, splitX:.46, x:PATH_X+3.5, y:PATH_Y+.6},
  {key:"yellow", legY:.71, splitX:.34, x:PATH_X-3.5, y:PATH_Y+.6}
].map(k=>{ const im=new Image(); im.src=KID_IMG[k.key]; return {...k,im,tx:null,ty:null,wait:1+Math.random()*3,dir:1,ph:Math.random()*6,wave:0,walking:false}; });
function kidTarget(k){
  for(let i=0;i<20;i++){ const x=Math.max(1,Math.min(MC-2,k.x+(Math.random()-.5)*12)), y=Math.max(2,Math.min(MR-2,k.y+(Math.random()-.5)*10)), kind=tileKind(Math.floor(x),Math.floor(y));
    if(kind==="path"||kind==="grass"||kind==="bridge"){ k.tx=x; k.ty=y; return; } }
}
function stepKids(dt){
  KIDS.forEach(k=>{
    if(k.wave>0){ k.wave-=dt; k.walking=false; return; }
    if(k.tx==null){ k.wait-=dt; k.walking=false; if(k.wait<=0) kidTarget(k); return; }
    const dx=k.tx-k.x, dy=k.ty-k.y, d=Math.hypot(dx,dy);
    if(d<.05){ k.tx=null; k.wait=2+Math.random()*5; k.walking=false; return; }
    const sp=Math.min(d,dt*.9); k.x+=dx/d*sp; k.y+=dy/d*sp; k.walking=true; k.ph+=dt*7; if(Math.abs(dx)>.02) k.dir=dx<0?-1:1;
  });
}
function drawKids(items,c,t,time){
  KIDS.forEach(k=>{ items.push({y:k.y,d:()=>{
    const im=k.im; if(!im.complete||!im.naturalWidth) return;
    const W0=im.naturalWidth, H0=im.naturalHeight, h=t*1.6, w=h*W0/H0;
    const legTop=H0*k.legY, sx=W0*k.splitX;
    const swing=k.walking?Math.sin(k.ph)*.38:0, bob=k.walking?Math.abs(Math.sin(k.ph))*t*.05:0;
    const rock=k.wave>0?Math.sin(time*12)*.12:0;
    c.fillStyle="rgba(0,0,0,.15)"; c.beginPath(); c.ellipse(k.x*t,k.y*t+t*.04,w*.3,t*.08,0,0,Math.PI*2); c.fill();
    c.save(); c.translate(k.x*t,k.y*t-bob); c.scale(k.dir,1); c.rotate(rock);
    const ox=-w/2, oy=-h, s=w/W0;
    // 다리: 왼쪽·오른쪽을 엉덩이에서 번갈아 흔듦
    [[0,sx,swing],[sx,W0-sx,-swing]].forEach(([x0,ww,a])=>{ c.save(); const px=ox+(x0+ww/2)*s, py=oy+legTop*s; c.translate(px,py); c.rotate(a);
      c.drawImage(im,x0,legTop,ww,H0-legTop,-ww/2*s,0,ww*s,(H0-legTop)*s); c.restore(); });
    // 몸통
    c.drawImage(im,0,0,W0,legTop,ox,oy,w,legTop*s);
    c.restore();
    if(k.wave>0){ emo(c,"👋",k.x*t+k.dir*w*.5,k.y*t-h*.75+Math.sin(time*12)*t*.05,t*.45);
      label(c,"안녕!",k.x*t,k.y*t-h-4,Math.max(12,t*.34),"#c2410c"); }
  }}); });
}
function kidTap(fx,fy){
  const k=KIDS.find(k=>Math.abs(k.x-fx)<.7&&fy>k.y-1.4&&fy<k.y+.2); if(!k) return false;
  k.wave=2.6; k.dir=W.map.x<k.x?-1:1;
  [784,988,1175].forEach((f,i)=>tone(f,.18,{at:i*.09,vol:.06,type:"triangle"}));
  return true;
}

function drawAwaySign(c,o,x,y,t){
  const txt=awayText(o), fs=Math.max(12,t*.3); c.font=`${fs}px "Gowun Dodum",sans-serif`;
  const lines=wrapText(c,txt,t*5.2), lh=fs*1.3, w=Math.max(...lines.map(l=>c.measureText(l).width))+18, h=lines.length*lh+12;
  const bx=Math.max(camOX+4,Math.min(x-w/2,camOX+G.w-w-4)), by=y-h-t*.35;
  rr(c,x-t*.05,by+h-2,t*.1,t*.55,2,"#7a5232");
  rr(c,bx,by,w,h,8,"#f6e3bd"); c.strokeStyle="#9a6a45"; c.lineWidth=2; c.beginPath(); c.roundRect(bx,by,w,h,8); c.stroke();
  c.fillStyle="#5a3a22"; c.textAlign="center"; c.textBaseline="top"; lines.forEach((l,i)=>c.fillText(l,bx+w/2,by+6+i*lh));
}

function tapRoom(fx,fy){
  const x=Math.floor(fx), y=Math.floor(fy), o=owner(), visiting=!!visitId; if(x<0||y<0||x>=RC||y>=RR) return;
  if(placing){
    const def=FURN[placing.k], ok=def.wall?y===0:y>=1&&!(x===ROOM_DOOR.x&&y===ROOM_DOOR.y);
    const taken=roomOf(S).some(f=>f.x===x&&f.y===y&&!!FURN[f.k].flat===!!def.flat&&!!FURN[f.k].wall===!!def.wall);
    if(!ok){ toast(def.wall?"벽(맨 윗줄)에만 걸 수 있어요":"바닥에 놓아주세요"); SFX.no(); return; }
    if(taken){ toast("이미 다른 가구가 있어요"); SFX.no(); return; }
    S.room=S.room||[]; S.room.push({k:placing.k,x,y}); logAct(`${def.name} 놓기`); placing=null; SFX.build(); puff(x+.5,y+.5,"#ffd84d"); save(); renderAct(); toast(`${def.name}을(를) 놓았어요`); return;
  }
  if(x===ROOM_DOOR.x&&y===ROOM_DOOR.y){ resting=null; walkTo(W.room,[[x+.5,y+.5]],leaveRoom); return; }
  const here=roomOf(o).filter(f=>f.x===x&&f.y===y&&!FURN[f.k].flat);
  const f=here[0]||roomOf(o).find(f=>f.x===x&&f.y===y);
  resting=null;
  if(f){
    const ty=Math.max(1.5,y+(FURN[f.k].wall?1.6:.62));
    walkTo(W.room,[[x+.5,ty]],()=>{
      if(f.k==="bed"||f.k==="sofa"||f.k==="chair"){ resting=f.k; W.room.x=x+.5; W.room.y=y+.5; renderAct(); if(f.k==="bed") toast("포근하다…"); }
      if(!visiting) furnItemSheet(f);
    });
    return;
  }
  walkTo(W.room,[[x+.5,Math.max(1.4,y+.6)]],()=>renderAct()); renderAct();
}
function furnSheet(){
  openSheet("가구 놓기",`<p class="note">가구를 고른 뒤 방에서 놓을 자리를 눌러주세요. 벽시계, 액자, 창문은 벽에 걸어요.</p>
   <div class="closet">${Object.entries(FURN).map(([k,f])=>{ const have=(S.furnStore||{})[k]||0; return `<button class="acc" data-f="${k}">${furnIcon(k)}${f.name}<span class="p">${have?`보관 ${have}개`:"🪙"+f.price}</span></button>`}).join("")}</div>`,
   w=>w.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{
     const k=b.dataset.f; S.furnStore=S.furnStore||{};
     if(S.furnStore[k]>0){ S.furnStore[k]--; } else { if(!pay(FURN[k].price)) return; }
     placing={k,from:"new"}; save(); closeSheet(); renderTop(); renderAct(); }));
}
function furnItemSheet(f){
  openSheet(FURN[f.k].name,`<div class="row"><button class="btn sub grow" id="fMove">옮기기</button><button class="btn sub grow" id="fStore">치우기</button></div><p class="note">치운 가구는 보관함에 들어가서 다시 꺼낼 수 있어요.</p>`,
    w=>{ w.querySelector("#fMove").onclick=()=>{ S.room=S.room.filter(x=>x!==f); placing={k:f.k,item:f}; closeSheet(); renderAct(); };
         w.querySelector("#fStore").onclick=()=>{ S.room=S.room.filter(x=>x!==f); S.furnStore=S.furnStore||{}; S.furnStore[f.k]=(S.furnStore[f.k]||0)+1; resting=null; save(); closeSheet(); renderAct(); toast("보관함에 넣었어요"); }; });
}
function furnIcon(k){
  const cv=document.createElement("canvas"); cv.width=128; cv.height=128; const c=cv.getContext("2d");
  if(FURN[k].wall){ c.fillStyle="#f3e3c4"; c.fillRect(0,0,128,128); }
  drawFurn(c,k,24,FURN[k].wall?24:30,80,Date.now()/1000);
  return `<img src="${cv.toDataURL()}" width="64" height="64" alt="">`;
}
function drawFurn(c,k,x,y,t,time){
  const P=(a,b,w,h,r,f)=>rr(c,x+a*t,y+b*t,w*t,h*t,r*t,f);
  switch(k){
    case "bed": P(.06,-.3,.88,1.22,.12,"#8b5a34"); P(.12,-.22,.76,1.06,.1,"#fffaf0"); P(.12,.22,.76,.62,.1,"#8fb8e8"); P(.12,.22,.76,.1,.04,"#a9c9f0"); P(.22,-.14,.56,.26,.1,"#fdeed5"); break;
    case "table": P(.14,.5,.08,.42,.03,"#7a4a2a"); P(.78,.5,.08,.42,.03,"#7a4a2a"); P(.04,.18,.92,.4,.12,"#a46b3d"); P(.04,.18,.92,.12,.06,"#c08a55");
      c.fillStyle="#fff"; c.beginPath(); c.ellipse(x+.35*t,y+.3*t,.12*t,.06*t,0,0,Math.PI*2); c.ellipse(x+.66*t,y+.3*t,.12*t,.06*t,0,0,Math.PI*2); c.fill(); break;
    case "chair": P(.24,.0,.52,.5,.08,"#c08a55"); P(.2,.46,.6,.18,.06,"#a46b3d"); P(.24,.6,.08,.32,.03,"#7a4a2a"); P(.68,.6,.08,.32,.03,"#7a4a2a"); break;
    case "sofa": P(.02,.1,.96,.5,.16,"#e2566f"); P(.02,.4,.96,.44,.14,"#c94560"); P(0,.3,.16,.56,.08,"#b33a54"); P(.84,.3,.16,.56,.08,"#b33a54"); P(.2,.42,.28,.2,.08,"#f07a90"); P(.52,.42,.28,.2,.08,"#f07a90"); break;
    case "rug": c.fillStyle="#f2b632"; c.beginPath(); c.ellipse(x+.5*t,y+.55*t,.48*t,.36*t,0,0,Math.PI*2); c.fill();
      c.strokeStyle="#fff6c9"; c.lineWidth=t*.05; c.beginPath(); c.ellipse(x+.5*t,y+.55*t,.34*t,.24*t,0,0,Math.PI*2); c.stroke(); break;

let raf=null, lastT=0;
function startLoop(){ if(raf) return; lastT=performance.now(); raf=requestAnimationFrame(loop); }
function loop(now){
  raf=null; if(!S||tab!=="village"||!G||!G.cv.isConnected) return;
  const dt=Math.min(.05,(now-lastT)/1000), time=now/1000; lastT=now;
  const w=W[where];
  if(w.path.length){ const p=w.path[0], dx=p.x-w.x, dy=p.y-w.y, d=Math.hypot(dx,dy), sp=dt*(where==="world"?2.6:3.2);
    if(d<=sp){ w.x=p.x; w.y=p.y; w.path.shift(); if(!w.path.length&&w.cb){ const cb=w.cb; w.cb=null; cb(); } }
    else { w.x+=dx/d*sp; w.y+=dy/d*sp; if(Math.random()<dt*3) tone(300+Math.random()*80,.04,{vol:.015,type:"triangle"}); } }
  stepPeers(dt); sharePosition(now);
  const c=G.ctx, t=G.t;
  c.clearRect(0,0,G.w,G.h);
  const drawSparklesZ=tt=>{ sparkles=sparkles.filter(s=>(s.life-=dt*1.6)>0);
    sparkles.forEach(s=>{ s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=dt*3; c.globalAlpha=s.life; c.fillStyle=s.color; c.beginPath(); c.arc(s.x*tt,s.y*tt,tt*.06,0,Math.PI*2); c.fill(); c.globalAlpha=1; }); };
  const drawSparkles=()=>drawSparklesZ(t);
  if(where==="map"){
    if(cam.follow){ const m=1.2, me=W.map, vw=viewW(), vh=viewH(); let nx=cam.x, ny=cam.y;
      if(me.x<cam.x+m) nx=me.x-m; else if(me.x>cam.x+vw-m) nx=me.x-vw+m;
      if(me.y<cam.y+m*1.4) ny=me.y-m*1.4; else if(me.y>cam.y+vh-m) ny=me.y-vh+m;
      cam.x+=(nx-cam.x)*Math.min(1,dt*5); cam.y+=(ny-cam.y)*Math.min(1,dt*5); clampCam();
      if(!isMoving(me)) cam.follow=false; }
    const tz=t*cam.zoom; camOX=cam.x*tz;
    c.fillStyle="#5f9e3a"; c.fillRect(0,0,G.w,G.h);
    c.save(); c.translate(-cam.x*tz,-cam.y*tz); drawMap(c,tz,time,dt); const t0=t; drawSparklesZ(tz); c.restore();
  } else { camOX=0; if(where==="room") drawRoom(c,t,time); else drawWorld(c,t,time); drawSparkles(); }
  raf=requestAnimationFrame(loop);
}

async function toggleHidden(pid){
  if(!isOwnerView) return;
  const ref=db.doc("config/site");
  try{ const sn=await ref.get(); const cfg=sn.exists?JSON.parse(JSON.stringify(sn.data())):{};
    const h=new Set(Array.isArray(cfg.hidden)?cfg.hidden:[]); const was=h.has(pid); was?h.delete(pid):h.add(pid);
    await ref.set({...cfg,hidden:[...h]}); siteHidden=h; render(); SFX.tap(); toast(was?"다시 모두에게 보여요":"모두에게 숨겼어요"); }
  catch(e){ toast("바꾸지 못했어요 ("+((e&&e.code)||"error")+")"); }
}

const TRADEABLE=["coin",...Object.keys(ITEMS)];
function vTrade(v){

  const open=offers.filter(o=>o.status==="open");
  v.innerHTML=`<div class="card" style="display:flex;flex-direction:column;gap:8px">

    <div class="row"><select id="wItem" class="grow">${TRADEABLE.map(k=>`<option value="${k}" ${k==="rice"?"selected":""}>${itemIc(k)} ${itemName(k)}</option>`).join("")}</select><input id="wQty" type="number" min="1" value="1" style="width:76px"></div>
    <button class="btn" id="postOffer">게시판에 올리기</button>
    <p class="note">올리는 순간 줄 물건은 맡겨두고, 누가 받아주면 받고 싶은 것이 자동으로 들어와요.</p>
  </div>
  <h2>교환 게시판</h2>
  ${open.length?`<div class="list">${open.map(o=>{ const mine=o.seller===docId; return `<div class="item"><span class="grow"><span class="nm">${esc(o.sellerNick)}</span><br>
    <span>${itemIc(o.give.item)} ${itemName(o.give.item)} ${o.give.qty} → ${itemIc(o.want.item)} ${itemName(o.want.item)} ${o.want.qty}</span><br><span class="sub">${ago(o.createdAt)}</span></span>
    ${mine?`<button class="btn sm sub" data-cancel="${o.id}">내리기</button>`:`<button class="btn sm" data-take="${o.id}">교환하기</button>`}</div>`; }).join("")}</div>`
    :`<p class="note">아직 올라온 교환이 없어요.</p>`}`;
  v.querySelector("#postOffer").onclick=postOffer;
  v.querySelectorAll("[data-take]").forEach(b=>b.onclick=()=>takeOffer(b.dataset.take));
  v.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>cancelOffer(b.dataset.cancel));

async function postOffer(){
  const g=$("gItem").value, gq=Math.max(1,parseInt($("gQty").value)||1), w=$("wItem").value, wq=Math.max(1,parseInt($("wQty").value)||1);
  if(g===w){ toast("서로 다른 것을 골라주세요"); return; }
  if(!has(g,gq)){ toast(`${itemName(g)}이(가) 모자라요`); SFX.no(); return; }
  try{
    addInv(g,-gq); save(); await flush();
    await db.collection("offers").add({seller:docId,sellerNick:S.nick,give:{item:g,qty:gq},want:{item:w,qty:wq},status:"open",createdAt:Date.now()});
    SFX.coin(); toast("교환을 올렸어요"); render();
  }catch(e){ addInv(g,gq); save(); toast("올리지 못했어요. 쓰기 권한을 확인해주세요"); }
}
async function takeOffer(id){
  const ref=db.doc("offers/"+id);
  try{
    const snap=await ref.get(); const o=snap.exists?snap.data():null;
    if(!o||o.status!=="open"){ toast("이미 끝난 교환이에요"); return; }
    if(!has(o.want.item,o.want.qty)){ toast(`${itemName(o.want.item)}이(가) ${o.want.qty}개 필요해요`); SFX.no(); return; }
    const lock=await ref.acquire({holder:docId,ttlMs:8000});
    if(!lock.acquired){ toast("다른 사람이 교환 중이에요. 잠시 후 다시 해보세요"); return; }
    await ref.update({status:"taken",buyer:docId,buyerNick:S.nick,takenAt:Date.now()});
    addInv(o.want.item,-o.want.qty); addInv(o.give.item,o.give.qty); save();
    SFX.coin(); logAct(`${o.sellerNick}님과 교환`); toast(`${itemName(o.give.item)} ${o.give.qty}개를 받았어요`);
    try{ await db.collection("chat").add({from:"system",nick:"게시판",text:`${S.nick}님이 ${o.sellerNick}님과 ${itemName(o.give.item)} ↔ ${itemName(o.want.item)} 교환을 했어요`,at:Date.now()}); }catch(e){}
  }catch(e){ toast("교환하지 못했어요. 쓰기 권한을 확인해주세요"); }
}
async function cancelOffer(id){
  const o=offers.find(x=>x.id===id); if(!o||o.status!=="open") return;
  try{ await db.doc("offers/"+id).update({status:"cancelled"}); addInv(o.give.item,o.give.qty); save(); toast("교환을 내리고 물건을 돌려받았어요"); }
  catch(e){ toast("내리지 못했어요"); }
}
let settling=new Set();
async function settleOffers(){
  if(!S) return;
  for(const o of offers){
    if(o.seller!==docId||o.status!=="taken"||settling.has(o.id)) continue;
    settling.add(o.id);
    try{ await db.doc("offers/"+o.id).update({status:"done"}); addInv(o.want.item,o.want.qty); save(); SFX.coin();
      toast(`${o.buyerNick}님과 교환했어요! ${itemName(o.want.item)} ${o.want.qty}개가 들어왔어요`); if(tab!=="chat") render(); }
    catch(e){ settling.delete(o.id); }
  }
}

}

// =====================================================================
// 시계: 작물 자람, 동물 울음
// =====================================================================
const grownSeen={};
let nextCry=Date.now()+15000;
setInterval(()=>{
  if(!S) return;
  Object.entries(S.field||{}).forEach(([i,p])=>{
    const key=p.crop+":"+p.at, st=plotState(p);
    if(st.stage!=="ready") grownSeen[i]="g"+key;
    else if(grownSeen[i]==="g"+key){ grownSeen[i]="r"+key; SFX.grown(); toast(`${CROPS[p.crop].item||CROPS[p.crop].name}이(가) 다 자랐어요!`); if(tab==="village") renderAct(); }
    else grownSeen[i]="r"+key;
  });
  if(Date.now()>nextCry&&S.animals.length&&!document.hidden){
    const i=Math.floor(Math.random()*S.animals.length); voice(S.animals[i].type);
    if(tab==="village"&&where==="map"&&!visitId&&anims[i]) anims[i].say=1.6;
    nextCry=Date.now()+25000+Math.random()*25000;
  }
  if(tab==="village"){ const at=$("actTime"); if(at&&sel){ const f=fieldOf(owner())[sel.x+","+sel.y]; if(f) at.textContent=fmt(plotState(f).left); } }
  else if(tab==="rest"){ const rt=$("restTime"); if(rt&&S.rest) rt.textContent=fmt((Date.now()-S.rest.since)/1000); }
},1000);
document.addEventListener("visibilitychange",()=>{ if(document.hidden&&dirty) flush(); });
</script>

</body></html>
